groups:
  - name: erp03.api
    rules:
      - alert: HighErrorRate
        expr: sum(rate(erp03_http_requests_total{status=~"5.."}[5m])) / sum(rate(erp03_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on ERP03 API"
          description: "Error rate is above 1% for more than 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(erp03_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on ERP03 API"
          description: "95th percentile latency is above 500ms"
