apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp03-ingress
  namespace: erp03
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - erp.example.com
      secretName: erp03-tls
  rules:
    - host: erp.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: erp03-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp03-frontend
                port:
                  number: 80
