apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp03-ingress
  namespace: erp03
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - erp.example.com
      secretName: erp03-tls
  rules:
    - host: erp.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: erp03-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp03-frontend
                port:
                  number: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp03-backend
  namespace: erp03
  labels:
    app: erp03-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erp03-backend-role
  namespace: erp03
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erp03-backend-rolebinding
  namespace: erp03
subjects:
  - kind: ServiceAccount
    name: erp03-backend
    namespace: erp03
roleRef:
  kind: Role
  name: erp03-backend-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-backend-pdb
  namespace: erp03
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: erp03-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-frontend-pdb
  namespace: erp03
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: erp03-frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp03-backend-netpol
  namespace: erp03
spec:
  podSelector:
    matchLabels:
      app: erp03-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: erp03-frontend
        - podSelector:
            matchLabels:
              app: erp03-ingress
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: erp03-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: erp03-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: erp03-ollama
      ports:
        - protocol: TCP
          port: 11434
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp03-frontend-netpol
  namespace: erp03
spec:
  podSelector:
    matchLabels:
      app: erp03-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: erp03-ingress
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: erp03-backend
      ports:
        - protocol: TCP
          port: 8000
    - to: []
      ports:
        - protocol: UDP
          port: 53
