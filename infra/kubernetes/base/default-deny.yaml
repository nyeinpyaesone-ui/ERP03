# Default deny for every pod in the ERP03 namespace.
#
# Traffic is only possible through the explicit allow policies in
# networkpolicy.yaml. Any new dependency must be added to an allow policy in
# the same change that introduces it — never by widening this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp03-default-deny
  namespace: erp03
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
