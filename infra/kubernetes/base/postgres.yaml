apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp03-postgres
  namespace: erp03
  labels:
    app: erp03-postgres
spec:
  serviceName: erp03-postgres
  replicas: 1
  selector:
    matchLabels:
      app: erp03-postgres
  template:
    metadata:
      labels:
        app: erp03-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15-alpine@sha256:REPLACE_WITH_REAL_DIGEST
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: erp03
            - name: POSTGRES_USER
              value: erp03
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp03-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "erp03", "-d", "erp03"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "erp03", "-d", "erp03"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: erp03-postgres
  namespace: erp03
  labels:
    app: erp03-postgres
spec:
  selector:
    app: erp03-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: erp03-postgres-rw
  namespace: erp03
  labels:
    app: erp03-postgres
spec:
  selector:
    app: erp03-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
