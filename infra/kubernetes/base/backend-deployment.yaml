apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp03-backend
  namespace: erp03
  labels:
    app: erp03-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: erp03-backend
  template:
    metadata:
      labels:
        app: erp03-backend
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: erp03-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/nyeinpyaesone-ui/erp03-backend:latest
          ports:
            - containerPort: 8000
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          envFrom:
            - configMapRef:
                name: erp03-runtime
            - secretRef:
                name: erp03-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://erp03:$(POSTGRES_PASSWORD)@erp03-postgres:5432/erp03"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@erp03-redis:6379/0"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
