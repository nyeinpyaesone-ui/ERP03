# Template only — NOT a kustomize resource and never applied as-is.
#
# The `erp03-secrets` Secret is referenced by the backend Deployment but is
# intentionally absent from this repository. Create it per environment from a
# secret manager:
#
#   kubectl -n <namespace> create secret generic erp03-secrets \
#     --from-literal=SECRET_KEY="$SECRET_KEY" \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
#
# Rotate values on the cadence in docs/MAINTENANCE_CHECKLIST.md. gitleaks and
# CodeQL scanning must stay green: no real value may ever be written here.
apiVersion: v1
kind: Secret
metadata:
  name: erp03-secrets
  namespace: erp03
  labels:
    app.kubernetes.io/part-of: erp03
type: Opaque
stringData:
  SECRET_KEY: REPLACE_WITH_32_BYTE_SECRET
  DATABASE_URL: REPLACE_WITH_DATABASE_URL
  POSTGRES_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD
