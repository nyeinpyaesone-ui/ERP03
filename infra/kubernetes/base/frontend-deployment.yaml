apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp03-frontend
  namespace: erp03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp03-frontend
  template:
    metadata:
      labels:
        app: erp03-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nyeinpyaesone-ui/erp03-frontend@sha256:REPLACE_WITH_REAL_DIGEST
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
