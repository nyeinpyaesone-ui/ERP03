apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp03-frontend
  namespace: erp03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp03-frontend
  template:
    metadata:
      labels:
        app: erp03-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nyeinpyaesone-ui/erp03-frontend:main
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_UPSTREAM
              value: http://erp03-backend:8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
