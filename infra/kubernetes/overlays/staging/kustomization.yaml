# staging — mirrors production sizing and configuration so promotion is
# validated against the real release shape before production sign-off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp03-staging

resources:
  - ../../base
  - ../../components/postgres
  - ../../components/redis

images:
  - name: ghcr.io/nyeinpyaesone-ui/erp03-backend
    newTag: staging
  - name: ghcr.io/nyeinpyaesone-ui/erp03-frontend
    newTag: staging

patches:
  - target:
      kind: Namespace
      name: erp03
    patch: |-
      - op: replace
        path: /metadata/name
        value: erp03-staging
  - target:
      kind: ConfigMap
      name: erp03-runtime
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: production
      - op: replace
        path: /data/CORS_ORIGINS
        value: https://staging.erp.example.invalid
  - target:
      kind: Ingress
      name: erp03
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.erp.example.invalid
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.erp.example.invalid
