apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: erp03-production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: erp03-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: erp03-frontend
  - patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: production
    target:
      kind: ConfigMap
      name: erp03-runtime
  - patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: https://erp.example.com
    target:
      kind: ConfigMap
      name: erp03-runtime
  - patch: |-
      - op: replace
        path: /stringData/DATABASE_URL
        value: postgresql+asyncpg://erp03:${DB_PASSWORD}@postgres:5432/erp03
    target:
      kind: Secret
      name: erp03-secrets
  - patch: |-
      - op: replace
        path: /stringData/SECRET_KEY
        value: ${SECRET_KEY}
    target:
      kind: Secret
      name: erp03-secrets
