apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp03-postgres
  namespace: erp03
  labels:
    app: erp03-postgres
spec:
  serviceName: erp03-postgres
  replicas: 1
  selector:
    matchLabels:
      app: erp03-postgres
  template:
    metadata:
      labels:
        app: erp03-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.14
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: erp03
            - name: POSTGRES_USER
              value: erp03
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp03-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "erp03", "-d", "erp03"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "erp03", "-d", "erp03"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
