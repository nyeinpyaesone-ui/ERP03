apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nyeinpyaesone-ui/ERP03.git
    targetRevision: feat/erpnext-isolated
    path: infra/erpnext/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: erpnext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
