apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp_solution-ollama
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-ollama
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: erp_solution
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp_solution-ollama
        app.kubernetes.io/component: ai
        app.kubernetes.io/part-of: erp_solution
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: ollama
        image: ollama/ollama:0.3.9@sha256:e3c5f8a6e8a7b3d4c5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8
        imagePullPolicy: IfNotPresent
        ports:
        - name: ollama
          containerPort: 11434
          protocol: TCP
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: erp_solution-ollama-data
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: erp_solution-ollama
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-ollama
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  ports:
  - name: ollama
    port: 11434
    targetPort: 11434
    protocol: TCP
  selector:
    app.kubernetes.io/name: erp_solution-ollama
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp_solution-ollama-data
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-ollama
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 50Gi
