# External Secrets Operator Configuration
# Replaces hardcoded secrets with AWS Secrets Manager references

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: erpo3
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpo3-db-secret
  namespace: erpo3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erpo3-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: erp/dev/db-password
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpo3-redis-secret
  namespace: erpo3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erpo3-redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: erp/dev/redis-auth-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpo3-jwt-secret
  namespace: erpo3
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erpo3-jwt-credentials
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: erp/dev/jwt-secret
