apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: erp_solution
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-db-secret
  namespace: erp_solution
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erp_solution-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/name: erp_solution-secrets
      type: Opaque
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: erp/production/db-password
        property: password
    - secretKey: DB_USER
      remoteRef:
        key: erp/production/db-credentials
        property: username
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-redis-secret
  namespace: erp_solution
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erp_solution-secrets
    creationPolicy: Owner
    template:
      mergePolicy: Replace
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: erp/production/redis-auth-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-jwt-secret
  namespace: erp_solution
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erp_solution-secrets
    creationPolicy: Owner
    template:
      mergePolicy: Replace
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: erp/production/jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-aws-secret
  namespace: erp_solution
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: erp_solution-secrets
    creationPolicy: Owner
    template:
      mergePolicy: Replace
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: erp/production/aws-credentials
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: erp/production/aws-credentials
        property: secret_access_key
