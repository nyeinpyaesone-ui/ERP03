apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp03

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - rbac.yaml
  - network-policy.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - ingress.yaml
  - cronjob.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/part-of: erp03
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/nyeinpyaesone-ui/erp03-api
    newTag: latest
  - name: ghcr.io/nyeinpyaesone-ui/erp03-web
    newTag: latest
  - name: ghcr.io/nyeinpyaesone-ui/erp03-worker
    newTag: latest

