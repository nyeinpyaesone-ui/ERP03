apiVersion: v1
kind: ServiceAccount
metadata:
  name: erpo3
  namespace: erpo3
  labels:
    app.kubernetes.io/name: erpo3
    app.kubernetes.io/part-of: erpo3
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erpo3
  namespace: erpo3
  labels:
    app.kubernetes.io/name: erpo3
    app.kubernetes.io/part-of: erpo3
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erpo3
  namespace: erpo3
  labels:
    app.kubernetes.io/name: erpo3
    app.kubernetes.io/part-of: erpo3
subjects:
- kind: ServiceAccount
  name: erpo3
  namespace: erpo3
roleRef:
  kind: Role
  name: erpo3
  apiGroup: rbac.authorization.k8s.io

