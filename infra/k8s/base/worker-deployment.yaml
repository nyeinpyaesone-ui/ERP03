apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp_solution-worker
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: erp_solution
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp_solution-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: erp_solution
    spec:
      serviceAccountName: erp_solution
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/nyeinpyaesone-ui/erp_solution-worker:latest
          imagePullPolicy: Always
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: erp_solution-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp_solution-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: erp_solution-secrets
                  key: SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: erp_solution-secrets
                  key: REDIS_URL
            - name: CELERY_CONCURRENCY
              value: "2"
          envFrom:
            - configMapRef:
                name: erp_solution-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [erp_solution-worker]
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: erp_solution-worker-hpa
  namespace: erp_solution
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: erp_solution-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
