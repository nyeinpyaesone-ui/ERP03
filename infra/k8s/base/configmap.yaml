apiVersion: v1
kind: ConfigMap
metadata:
  name: erp_solution-config
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_DB: "erp03_prod"
  REDIS_URL: "redis://erp_solution-redis:6379/0"
  CORS_ORIGINS: "https://erp-domain.com,https://admin.erp-domain.com"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"
  MAX_UPLOAD_SIZE: "52428800"
