# ERP03 Production Secrets (TEMPLATE ONLY)
# DO NOT COMMIT ACTUAL SECRETS
# In production, this secret is managed by External Secrets Operator
# See external-secrets.yaml for production configuration

apiVersion: v1
kind: Secret
metadata:
  name: erp_solution-secrets
  namespace: erp_solution
  annotations:
    # In production, this secret should be managed by External Secrets Operator
    # See external-secrets.yaml for production configuration
type: Opaque
stringData:
  # PLACEHOLDER VALUES - Replace with ExternalSecrets in production
  DB_USER: "erp_solution_user"
  DB_PASSWORD: "CHANGE_ME_USE_EXTERNALSECRETS"
  REDIS_PASSWORD: "CHANGE_ME_USE_EXTERNALSECRETS"
  JWT_SECRET: "CHANGE_ME_USE_EXTERNALSECRETS"
  AWS_ACCESS_KEY_ID: "CHANGE_ME_USE_EXTERNALSECRETS"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_USE_EXTERNALSECRETS"
---
# PodDisruptionBudget for API deployment
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp_solution-api-pdb
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-api
---
# PodDisruptionBudget for Web deployment
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp_solution-web-pdb
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-web
---
# PodDisruptionBudget for Worker deployment
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp_solution-worker-pdb
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-worker
---
# PodDisruptionBudget for Postgres StatefulSet
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp_solution-postgres-pdb
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-postgres
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-postgres
---
# PodDisruptionBudget for Redis StatefulSet
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp_solution-redis-pdb
  namespace: erp_solution
  labels:
    app.kubernetes.io/name: erp_solution-redis
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: erp_solution-redis
