apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-api-pdb
  namespace: erp03
  labels:
    app.kubernetes.io/name: erp03-api
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: erp03-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-web-pdb
  namespace: erp03
  labels:
    app.kubernetes.io/name: erp03-web
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp03-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-worker-pdb
  namespace: erp03
  labels:
    app.kubernetes.io/name: erp03-worker
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp03-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-postgres-pdb
  namespace: erp03
  labels:
    app.kubernetes.io/name: erp03-postgres
    app.kubernetes.io/component: database
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp03-postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp03-redis-pdb
  namespace: erp03
  labels:
    app.kubernetes.io/name: erp03-redis
    app.kubernetes.io/component: cache
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp03-redis
