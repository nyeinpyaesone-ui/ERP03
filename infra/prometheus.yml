global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: erp03

scrape_configs:
  - job_name: "erp03-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
    authorization:
      type: Bearer
      credentials: "${METRICS_SCRAPE_TOKEN}"

  - job_name: "erp03-frontend"
    static_configs:
      - targets: ["frontend:80"]
    scrape_interval: 15s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:9187"]
    scrape_interval: 30s

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    scrape_interval: 15s

rule_files:
  - "infra/prometheus-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
