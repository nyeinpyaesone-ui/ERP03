openapi: 3.0.3
info:
  title: ERP03 ERP-AI Integration Contract
  version: 1.0.0
  description: Versioned boundary between ERP-BACKEND and AI-BACKEND. AI never accesses ERP internals directly.
servers:
  - url: /integration/v1
security:
  - serviceBearer: []
paths:
  /erp/purchase-orders/{po_id}:
    get:
      operationId: getPurchaseOrder
      parameters:
        - name: po_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Approved ERP representation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrderView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /erp/commands:
    post:
      operationId: submitErpCommand
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommandRequest'}
      responses:
        '202':
          description: Command accepted for deterministic ERP processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  schemas:
    PurchaseOrderView:
      type: object
      required: [id, po_number, status, amount, currency_code]
      properties:
        id: {type: integer}
        po_number: {type: string}
        status: {type: string}
        amount: {type: number}
        currency_code: {type: string, pattern: '^[A-Z]{3}$'}
    CommandRequest:
      type: object
      required: [command_id, command_type, requested_by, payload]
      properties:
        command_id: {type: string, format: uuid}
        command_type: {type: string, enum: [purchase_order_approve, purchase_order_reject]}
        requested_by: {type: string}
        payload: {type: object}
    CommandAccepted:
      type: object
      required: [command_id, status]
      properties:
        command_id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, duplicate]}
  responses:
    BadRequest:
      description: Invalid contract payload
    Unauthorized:
      description: Missing or invalid service authentication
    Forbidden:
      description: Service is not authorized for this operation
    NotFound:
      description: ERP resource not found
    Conflict:
      description: Idempotency or state conflict
