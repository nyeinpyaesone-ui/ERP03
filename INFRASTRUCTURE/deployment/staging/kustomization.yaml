apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../base

namespace: erp03-staging

commonLabels:
  environment: staging

replicas:
  - name: erp-backend
    count: 2
  - name: erp-frontend
    count: 2
  - name: erp-worker
    count: 1

patches:
  # Reduce resource requests for staging
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
    target:
      kind: Deployment
      name: erp-backend
  - patch: |-
      - op: replace
        path: /metadata/data/environment
        value: "staging"
    target:
      kind: ConfigMap
      name: erp03-config

configMapGenerator:
  - name: erp03-config
    behavior: merge
    literals:
      - environment=staging
      - api-url=http://erp-backend-service.erp03-staging.svc.cluster.local:8000
      - log-level=debug
