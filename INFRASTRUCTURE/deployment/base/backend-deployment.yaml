apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-backend
  labels:
    app: erp-backend
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-backend
  template:
    metadata:
      labels:
        app: erp-backend
        component: backend
    spec:
      serviceAccountName: erp03-service-account
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: backend
        image: ghcr.io/nyeinpyaesone-ui/erp-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: erp03-config
              key: environment
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: erp03-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: erp03-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: erp03-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - erp-backend
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: erp-backend-service
  labels:
    app: erp-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: erp-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-frontend
  labels:
    app: erp-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-frontend
  template:
    metadata:
      labels:
        app: erp-frontend
        component: frontend
    spec:
      serviceAccountName: erp03-service-account
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: frontend
        image: ghcr.io/nyeinpyaesone-ui/erp-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: erp03-config
              key: environment
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: erp03-config
              key: api-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-frontend-service
  labels:
    app: erp-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: erp-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-worker
  labels:
    app: erp-worker
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-worker
  template:
    metadata:
      labels:
        app: erp-worker
        component: worker
    spec:
      serviceAccountName: erp03-service-account
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: worker
        image: ghcr.io/nyeinpyaesone-ui/erp-worker:latest
        imagePullPolicy: Always
        command: ["python", "-m", "uvicorn", "app.worker:app", "--host", "0.0.0.0", "--port", "8001"]
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: erp03-config
              key: environment
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: erp03-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: erp03-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp03-config
  labels:
    app: erp03
data:
  environment: "production"
  api-url: "http://erp-backend-service:8000"
  log-level: "info"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp03-service-account
  labels:
    app: erp03
