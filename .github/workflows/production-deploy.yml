name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag to deploy (for example v1.0.0)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY-PRODUCTION to authorize deployment"
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy immutable release
    if: ${{ inputs.confirm == 'DEPLOY-PRODUCTION' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 45
    steps:
      - name: Validate release ref
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $VERSION"; exit 1 ;;
          esac

      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with database backup and application rollback
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$GHCR_USER"
          test -n "$GHCR_TOKEN"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$VERSION' '$DEPLOY_PATH/backups'"
          tar --exclude=.git -czf - . | ssh "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$DEPLOY_PATH/releases/$VERSION'"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" /bin/bash -s -- "$DEPLOY_PATH" "$VERSION" "$GHCR_USER" "$GHCR_TOKEN" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          VERSION="$2"
          GHCR_USER="$3"
          GHCR_TOKEN="$4"
          RELEASE_DIR="$DEPLOY_PATH/releases/$VERSION"
          CURRENT_FILE="$DEPLOY_PATH/current-release"
          BACKUP_FILE="$DEPLOY_PATH/backups/pre-$VERSION.sql"
          PREVIOUS=""
          if [ -s "$CURRENT_FILE" ]; then PREVIOUS="$(cat "$CURRENT_FILE")"; fi

          cd "$RELEASE_DIR"
          test -f docker-compose.prod.yml
          docker compose -f docker-compose.prod.yml config >/dev/null

          if [ -n "$PREVIOUS" ] && [ -f "$DEPLOY_PATH/releases/$PREVIOUS/docker-compose.prod.yml" ]; then
            PREVIOUS_DIR="$DEPLOY_PATH/releases/$PREVIOUS"
          else
            PREVIOUS_DIR=""
          fi

          if [ -n "$PREVIOUS_DIR" ]; then
            cd "$PREVIOUS_DIR"
            docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            cd "$RELEASE_DIR"
          else
            echo "No previous release recorded; deployment proceeds without a pre-release database backup."
          fi

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export BACKEND_IMAGE_TAG="$VERSION" FRONTEND_IMAGE_TAG="$VERSION"
          docker compose -f docker-compose.prod.yml pull --quiet
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          check_health() {
            docker inspect --format='{{.State.Health.Status}}' erp-postgres | grep -qx healthy
            docker inspect --format='{{.State.Health.Status}}' erp-redis | grep -qx healthy
            docker inspect --format='{{.State.Health.Status}}' erp-backend | grep -qx healthy
            curl -fsS --max-time 10 http://127.0.0.1/api/v1/health >/dev/null
          }

          healthy=0
          for attempt in $(seq 1 36); do
            if check_health; then healthy=1; break; fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Release $VERSION failed production health checks."
            docker compose -f docker-compose.prod.yml logs --tail=200 || true
            if [ -n "$PREVIOUS_DIR" ]; then
              cd "$PREVIOUS_DIR"
              export BACKEND_IMAGE_TAG="$PREVIOUS" FRONTEND_IMAGE_TAG="$PREVIOUS"
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              docker compose -f docker-compose.prod.yml ps
              printf '%s\n' "$PREVIOUS" > "$CURRENT_FILE"
            fi
            exit 1
          fi

          printf '%s\n' "$VERSION" > "$CURRENT_FILE"
          docker compose -f docker-compose.prod.yml ps
          echo "Production release $VERSION deployed successfully."
REMOTE

      - name: Verify recorded release
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test \"\$(cat '$DEPLOY_PATH/current-release')\" = '$VERSION'"
