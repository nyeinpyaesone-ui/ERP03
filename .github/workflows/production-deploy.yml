name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag to deploy (for example v1.0.0)"
        required: true
        type: string
      backend_digest:
        description: "Published backend OCI digest (sha256:...)"
        required: true
        type: string
      frontend_digest:
        description: "Published frontend OCI digest (sha256:...)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY-PRODUCTION to authorize deployment"
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy immutable release
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-PRODUCTION' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Validate release ref and image digests
        env:
          VERSION: ${{ inputs.version }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::version must be a semantic version tag"
            exit 1
          }
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::backend_digest must be a sha256 OCI digest"
            exit 1
          }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::frontend_digest must be a sha256 OCI digest"
            exit 1
          }

      - name: Checkout immutable release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release source commit
        id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable release
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_ENV_FILE"
          test -n "$GHCR_USER"
          test -n "$GHCR_TOKEN"

          printf -v release_path '%s/releases/%s' "$DEPLOY_PATH" "$VERSION"
          printf -v remote_args '%q %q %q %q %q %q' "$release_path" "$DEPLOY_ENV_FILE" "$VERSION" "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$SOURCE_SHA"
          port="$DEPLOY_SSH_PORT"
          if [ -z "$port" ]; then port=22; fi

          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release_path'"

          tar --exclude=.git --exclude=.env -czf - . |
            ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$release_path'"

          printf '%s' "$GHCR_TOKEN" |
            ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"

          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_ENV_FILE'"

          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $remote_args" <<'REMOTE'
          set -Eeuo pipefail
          release_path="$1"
          env_file="$2"
          version="$3"
          backend_digest="$4"
          frontend_digest="$5"
          source_sha="$6"
          cd "$release_path"

          backend_image="ghcr.io/nyeinpyaesone-ui/erp03-backend@$backend_digest"
          frontend_image="ghcr.io/nyeinpyaesone-ui/erp03-frontend@$frontend_digest"
          export ERP03_BACKEND_IMAGE="$backend_image"
          export ERP03_FRONTEND_IMAGE="$frontend_image"
          export IMAGE_TAG="$version"

          docker compose --env-file "$env_file" --profile full pull backend frontend
          backend_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$backend_image")"
          frontend_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$frontend_image")"
          test "$backend_revision" = "$source_sha" || { echo "Backend digest does not match release source"; exit 1; }
          test "$frontend_revision" = "$source_sha" || { echo "Frontend digest does not match release source"; exit 1; }
          docker compose --env-file "$env_file" --profile full run --rm migrate
          docker compose --env-file "$env_file" --profile full up -d --remove-orphans backend frontend
          docker compose --env-file "$env_file" --profile full ps
          REMOTE

      - name: Verify production health
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          printf -v release_path '%s/releases/%s' "$DEPLOY_PATH" "$VERSION"
          printf -v remote_args '%q %q' "$release_path" "$DEPLOY_ENV_FILE"
          port="$DEPLOY_SSH_PORT"
          if [ -z "$port" ]; then port=22; fi
          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $remote_args" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1"
          env_file="$2"
          for service in backend frontend; do
            container_id="$(docker compose --env-file "$env_file" --profile full ps -q "$service" | head -n 1)"
            test -n "$container_id"
            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            test "$state" = "running"
            test "$health" = "healthy"
            echo "$service: state=$state health=$health"
          done
          REMOTE

      - name: Record deployed release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          VERSION: ${{ inputs.version }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s\n' '$VERSION' > '$DEPLOY_PATH/current-release'"
