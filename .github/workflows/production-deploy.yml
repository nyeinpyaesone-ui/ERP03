name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag to deploy (for example v1.0.0)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY-PRODUCTION to authorize deployment"
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy immutable release
    if: ${{ inputs.confirm == 'DEPLOY-PRODUCTION' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Validate release ref
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $VERSION"; exit 1 ;;
          esac

      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy immutable release
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$GHCR_USER"
          test -n "$GHCR_TOKEN"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases/$VERSION'"
          tar --exclude=.git -czf - . | ssh "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$DEPLOY_PATH/releases/$VERSION'"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; cd '$DEPLOY_PATH/releases/$VERSION'; printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin; export BACKEND_IMAGE_TAG='$VERSION' FRONTEND_IMAGE_TAG='$VERSION'; docker compose -f docker-compose.prod.yml pull --quiet; docker compose -f docker-compose.prod.yml up -d --remove-orphans; docker compose -f docker-compose.prod.yml ps"

      - name: Verify production health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; cd '$DEPLOY_PATH/releases/$VERSION'; docker compose -f docker-compose.prod.yml ps --status running; docker inspect --format='{{.State.Health.Status}}' erp-postgres | grep -qx healthy; docker inspect --format='{{.State.Health.Status}}' erp-redis | grep -qx healthy; docker inspect --format='{{.State.Health.Status}}' erp-backend | grep -qx healthy"

      - name: Record deployed release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ inputs.version }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s\n' '$VERSION' > '$DEPLOY_PATH/current-release'"
