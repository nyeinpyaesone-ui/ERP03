name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ERP-BACKEND
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.17.1

      - name: Run ruff check
        run: ruff check app tests alembic

      - name: Run ruff format check
        run: ruff format --check app tests alembic

      - name: Compile backend
        run: python -m compileall -q app alembic
