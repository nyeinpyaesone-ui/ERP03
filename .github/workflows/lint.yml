name: Code Quality & Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d relaxed docker-compose.erpnext.prod.yml .github/workflows/*.yml .github/dependabot.yml

  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python files
        run: |
          flake8 docker/erpnext/configure-oidc.py --max-line-length=120 --ignore=E501,W503

  lint-bash:
    name: Lint Bash Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Bash scripts
        run: |
          shellcheck docker/erpnext/production-entrypoint.sh

  validate-dockerfile:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate ERPNext Dockerfile
        run: |
          docker build --check -f docker/erpnext/Dockerfile .

      - name: Validate Nginx Dockerfile
        run: |
          docker build --check -f docker/nginx/Dockerfile .

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Validate compose file
        run: |
          docker-compose -f docker-compose.erpnext.prod.yml config --quiet

  summary:
    name: Quality Check Summary
    needs: [lint-yaml, lint-python, lint-bash, validate-dockerfile, validate-compose]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint-yaml.result }}" == "success" ] && \
             [ "${{ needs.lint-python.result }}" == "success" ] && \
             [ "${{ needs.lint-bash.result }}" == "success" ] && \
             [ "${{ needs.validate-dockerfile.result }}" == "success" ] && \
             [ "${{ needs.validate-compose.result }}" == "success" ]; then
            echo "✅ All quality checks passed!"
            exit 0
          else
            echo "❌ Some quality checks failed. Please review the logs above."
            exit 1
          fi
