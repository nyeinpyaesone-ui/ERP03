name: ERP03 AI DevOps Control Plane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-devops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine comparison range
        id: range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run AI DevOps control plane
        env:
          OLLAMA_BASE_URL: ${{ vars.ERP03_OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.ERP03_OLLAMA_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.ERP03_GEMINI_MODEL }}
        run: |
          python3 scripts/ai_devops_control.py \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            --output ai-devops-report.json

      - name: Upload control-plane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp03-ai-devops-report-${{ github.run_id }}
          path: ai-devops-report.json
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: ERP03 qualification gate
    needs: analyze
    uses: ./.github/workflows/erp03-qualification.yml
