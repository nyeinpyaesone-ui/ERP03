name: Infrastructure Validation

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_VAR_environment: dev
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD || 'dev-password-placeholder' }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY || 'dev-secret-key-placeholder-min-32-chars-long' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform fmt -check -recursive
        continue-on-error: true
      - run: terraform init -backend=false
        continue-on-error: true
      - run: terraform validate
        continue-on-error: true
      - run: terraform plan -input=false -out=tfplan.dev
        continue-on-error: true
      - name: Upload terraform plan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-dev
          path: infra/terraform/tfplan.dev
          retention-days: 7

  kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - run: kustomize build infra/kubernetes/base

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin
      - run: conftest test --policy infra/kubernetes/policies infra/kubernetes/ || true
