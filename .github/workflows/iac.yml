name: Infrastructure Validation

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform plan -input=false -var='environment=dev'

  kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - run: kustomize build infra/kubernetes/overlays/dev
      - run: kustomize build infra/kubernetes/overlays/staging
      - run: kustomize build infra/kubernetes/overlays/production

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin
      - run: conftest test --policy infra/kubernetes/policies infra/kubernetes/
