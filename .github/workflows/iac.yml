name: Infrastructure Validation

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.13.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform plan -input=false -var='environment=dev'

  kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f
      - run: kustomize build infra/kubernetes/overlays/dev
      - run: kustomize build infra/kubernetes/overlays/staging
      - run: kustomize build infra/kubernetes/overlays/production

  opa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install conftest
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$(uname -m)" in
            x86_64) asset_arch="Linux_x86_64" ;;
            *)
              echo "::error::Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          version="0.45.0"
          archive="conftest_${version}_${asset_arch}.tar.gz"
          url="https://github.com/open-policy-agent/conftest/releases/download/v${version}/${archive}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl             --fail             --location             --silent             --show-error             --retry 3             --retry-all-errors             --retry-delay 2             --connect-timeout 15             --max-time 120             --output "$workdir/$archive"             "$url"

          test -s "$workdir/$archive"
          tar -tzf "$workdir/$archive" >/dev/null
          tar -xzf "$workdir/$archive" -C "$workdir" conftest
          test -s "$workdir/conftest"
          install -m 0755 "$workdir/conftest" /usr/local/bin/conftest
          conftest --version
      - name: Validate Kubernetes policies
        run: conftest test --policy infra/kubernetes/policies infra/kubernetes/
