name: Infrastructure Validation

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.13.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform plan -input=false -var='environment=dev'

  kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f
      - run: kustomize build infra/kubernetes/overlays/dev
      - run: kustomize build infra/kubernetes/overlays/staging
      - run: kustomize build infra/kubernetes/overlays/production

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Conftest
        env:
          CONFTEST_VERSION: "0.45.0"
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          url="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --show-error --location --retry 3 --retry-all-errors --output "$archive" "$url"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest
          conftest --version
      - name: Enforce local Kubernetes policies
        run: |
          set -euo pipefail
          conftest test --policy infra/kubernetes/policies infra/kubernetes/
