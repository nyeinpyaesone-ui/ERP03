name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact published image tag (prefer a full commit SHA tag)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: erp03-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected images to staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error::Invalid image tag"
            exit 1
          }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Authenticate staging host to GHCR
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          port="${STAGING_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'docker login ghcr.io --username "$1" --password-stdin' sh "$GHCR_USERNAME"

      - name: Pull and restart selected images
        env:
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$DEPLOY_PATH"
          port="${STAGING_PORT:-22}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" sh -s -- "$DEPLOY_PATH" "$IMAGE_TAG" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          image_tag="$2"
          cd "$deploy_path"
          test -f docker-compose.yml || test -f compose.yml
          export IMAGE_TAG="$image_tag"
          docker compose pull backend frontend
          docker compose up -d --no-build backend frontend
          docker compose ps
          REMOTE
