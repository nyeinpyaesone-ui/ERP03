name: ERP03 Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend qualification
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ERP-BACKEND
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend qualification
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

  containers:
    name: Container qualification
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --pull -t erp03-backend:ci ./ERP-BACKEND

      - name: Build frontend image
        run: docker build --pull -t erp03-frontend:ci ./frontend
