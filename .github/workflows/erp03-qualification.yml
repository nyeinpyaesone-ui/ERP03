name: ERP03 Qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repository smoke test
        run: |
          test -f ERP-BACKEND/app/main.py
          test -f frontend/package.json
          echo "ERP03 workflow dispatch reached a runner."
