name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp03
          POSTGRES_USER: erp03
          POSTGRES_PASSWORD: erp03
        options: >-
          --health-cmd "pg_isready -U erp03 -d erp03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ERP-BACKEND
    env:
      DATABASE_URL: postgresql+asyncpg://erp03:erp03@127.0.0.1:5432/erp03
      REDIS_URL: redis://:erp03@127.0.0.1:6379/0
      REDIS_PASSWORD: erp03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ERP-BACKEND/requirements.txt
            ERP-BACKEND/dev-requirements.txt
      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Compile backend
        run: python -m compileall -q app alembic
      - name: Run database migrations
        run: alembic upgrade head
      - name: Run test suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: VITE_API_BASE_URL=/api npm run build