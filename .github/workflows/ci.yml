
name: CI

on:
  pull_request:
    paths:
      - 'ERP-BACKEND/**'
      - 'ERP-BACKEND/frontend-react/**'
      - 'AI-BACKEND/**'
      - 'INTEGRATION/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'ERP-BACKEND/**'
      - 'ERP-BACKEND/frontend-react/**'
      - 'AI-BACKEND/**'
      - 'INTEGRATION/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements*.txt
      - name: Install deps
        working-directory: ERP-BACKEND
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run tests
        working-directory: ERP-BACKEND
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests found"; fi

  integration-contract-test:
    name: Integration Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Run M2 contract tests
        run: python -m pytest -q INTEGRATION/contracts/v1/test_contract.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ERP-BACKEND/frontend-react/package-lock.json
      - name: Install & build
        working-directory: ERP-BACKEND/frontend-react
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build backend image
        uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          push: false
          tags: erp03-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          push: false
          tags: erp03-frontend:ci

  # Optional: build AI-BACKEND if Dockerfile exists
  ai-build:
    name: AI-BACKEND Build (optional)
    runs-on: ubuntu-latest
    if: hashFiles('AI-BACKEND/Dockerfile') != ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build AI image
        uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./AI-BACKEND
          file: ./AI-BACKEND/Dockerfile
          push: false
          tags: erp03-ai:ci
