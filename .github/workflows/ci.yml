name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp03
          POSTGRES_USER: erp03
          POSTGRES_PASSWORD: erp03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp03 -d erp03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ERP-BACKEND
    env:
      DATABASE_URL: postgresql+asyncpg://erp03:erp03@localhost:5432/erp03
      REDIS_URL: redis://localhost:6379/0
      REDIS_PASSWORD: ""
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ERP-BACKEND/requirements.txt
            ERP-BACKEND/dev-requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Compile backend
        run: python -m compileall -q app alembic
      - name: Wait for PostgreSQL to be ready
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if pg_isready -U erp03 -d erp03 -h localhost -p 5432 &&
              PGPASSWORD=erp03 psql -v ON_ERROR_STOP=1 -U erp03 -d erp03 -h localhost -p 5432 -c "SELECT 1" >/dev/null; then
              echo "PostgreSQL is ready and accepting authenticated connections"
              break
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            if [ "$i" -eq 30 ]; then
              echo "::error::PostgreSQL did not become ready"
              exit 1
            fi
            sleep 2
          done
      - name: Run database migrations
        run: |
          set -euo pipefail
          for i in {1..5}; do
            if alembic upgrade head; then
              echo "Migrations completed successfully"
              break
            fi
            echo "Migration failed (attempt $i/5)"
            if [ "$i" -eq 5 ]; then
              echo "::error::Database migrations failed after 5 attempts"
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Run test suite
        run: |
          set -euo pipefail
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: VITE_API_BASE_URL=/api npm run build
