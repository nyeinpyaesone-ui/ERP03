name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and container validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Backend configuration smoke test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          SECRET_KEY: ci-only-secret-key-not-for-runtime
        run: python -c "from app.config import settings; assert settings.DATABASE_URL.startswith('postgresql://'); assert len(settings.SECRET_KEY) > 10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install frontend dependencies
        working-directory: backend/frontend-react
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: backend/frontend-react
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate development Compose
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erp_solution
          DATABASE_URL: postgresql://erp:ci-only-password@postgres:5432/erp_solution
          SECRET_KEY: ci-only-secret-key-not-for-runtime
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: erp03/backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/frontend-react
          file: ./backend/frontend-react/Dockerfile
          push: false
          tags: erp03/frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
