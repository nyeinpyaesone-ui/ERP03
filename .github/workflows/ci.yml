name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp03
          POSTGRES_USER: erp03
          POSTGRES_PASSWORD: erp03
        options: >-
          --health-cmd "pg_isready -U erp03 -d erp03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ERP-BACKEND
    env:
      REDIS_PASSWORD: erp03
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ERP-BACKEND/requirements.txt
            ERP-BACKEND/dev-requirements.txt
      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Compile backend
        run: python -m compileall -q app alembic
      - name: Wait for PostgreSQL to be ready
        run: |
          PG_PORT="${{ job.services.postgres.ports[5432] }}"
          echo "PostgreSQL mapped port: $PG_PORT"
          for i in {1..30}; do
            if pg_isready -U erp03 -d erp03 -h 127.0.0.1 -p "$PG_PORT"; then
              # Also verify we can actually connect with the credentials
              if PGPASSWORD=erp03 psql -U erp03 -d erp03 -h 127.0.0.1 -p "$PG_PORT" -c "SELECT 1" >/dev/null 2>&1; then
                echo "PostgreSQL is ready and accepting connections"
                break
              fi
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done
      - name: Run database migrations
        run: |
          PG_PORT="${{ job.services.postgres.ports[5432] }}"
          REDIS_PORT="${{ job.services.redis.ports[6379] }}"
          export DATABASE_URL="postgresql+asyncpg://erp03:erp03@127.0.0.1:$PG_PORT/erp03"
          export REDIS_URL="redis://:erp03@127.0.0.1:$REDIS_PORT/0"
          alembic upgrade head
      - name: Run test suite
        run: |
          PG_PORT="${{ job.services.postgres.ports[5432] }}"
          REDIS_PORT="${{ job.services.redis.ports[6379] }}"
          export DATABASE_URL="postgresql+asyncpg://erp03:erp03@127.0.0.1:$PG_PORT/erp03"
          export REDIS_URL="redis://:erp03@127.0.0.1:$REDIS_PORT/0"
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: VITE_API_BASE_URL=/api npm run build