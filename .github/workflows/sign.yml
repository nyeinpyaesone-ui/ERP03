name: Sign & Verify

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
      - name: Sign backend image
        run: |
          cosign sign --key ${{ secrets.COSIGN_KEY }} \
            ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.ref_name }}
      - name: Verify backend signature
        run: |
          cosign verify --key ${{ secrets.COSIGN_PUB_KEY }} \
            ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.ref_name }}

  sign-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
      - name: Sign frontend image
        run: |
          cosign sign --key ${{ secrets.COSIGN_KEY }} \
            ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.ref_name }}
      - name: Verify frontend signature
        run: |
          cosign verify --key ${{ secrets.COSIGN_PUB_KEY }} \
            ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.ref_name }}
