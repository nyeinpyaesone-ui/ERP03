name: ERP03 Complete CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  DOCKERHUB_USERNAME: powerrangeranikg
  DOCKERHUB_REPO_PREFIX: powerrangeranikg

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-22.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      erp-core: ${{ steps.filter.outputs.erp-core }}
      erp03: ${{ steps.filter.outputs.erp03 }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            backend:
              - 'ERP-BACKEND/**'
              - '!ERP-BACKEND/**/*.md'
            erp-core:
              - 'erp-core/**'
              - '!erp-core/**/*.md'
            erp03:
              - 'erp03/**'
              - '!erp03/**/*.md'
            mobile:
              - 'mobile/**'
              - '!mobile/**/*.md'
            docker:
              - 'docker/**'
              - 'docker-compose*.yml'
            any:
              - 'frontend/**'
              - 'ERP-BACKEND/**'
              - 'erp-core/**'
              - 'erp03/**'
              - 'mobile/**'
              - 'docker/**'

  backend-ci:
    name: Backend CI
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.any == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt
      - working-directory: ERP-BACKEND
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - working-directory: ERP-BACKEND
        run: |
          pip install ruff
          ruff check . --output-format=github
      - working-directory: ERP-BACKEND
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports || true
      - working-directory: ERP-BACKEND
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term -v || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ERP-BACKEND/coverage.xml
          retention-days: 7

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.any == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  erp-core-ci:
    name: ERP-Core CI
    needs: changes
    if: ${{ needs.changes.outputs.erp-core == 'true' || needs.changes.outputs.any == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: erp-core/requirements.txt
      - working-directory: erp-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - working-directory: erp-core
        run: |
          pip install ruff
          ruff check . --output-format=github || true
      - working-directory: erp-core
        run: |
          pip install pytest pytest-cov
          pytest --cov=app --cov-report=xml -v || true

  erp03-apps-ci:
    name: ERP03 Apps CI
    needs: changes
    if: ${{ needs.changes.outputs.erp03 == 'true' || needs.changes.outputs.any == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: erp03/apps/erp/requirements.txt
      - working-directory: erp03/apps/erp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - working-directory: erp03/apps/erp
        run: |
          pip install ruff
          ruff check . --output-format=github || true
      - working-directory: erp03/apps/erp
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
        run: |
          pip install pytest pytest-cov
          pytest --cov=app --cov-report=xml -v || true

  mobile-ci:
    name: Mobile CI
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || needs.changes.outputs.any == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - working-directory: mobile
        run: npx tsc --noEmit || true
      - working-directory: mobile
        run: npm run lint || true

  docker-build-push:
    name: Docker Build & Push
    needs: [changes, backend-ci, frontend-ci, erp-core-ci, erp03-apps-ci]
    if: |
      always() && 
      !contains(needs.*.result, 'failure') && 
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push'
    runs-on: ubuntu-22.04
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            repo: erp03-frontend
          - name: backend
            context: ./ERP-BACKEND
            dockerfile: ./ERP-BACKEND/Dockerfile
            repo: erp03-backend
          - name: worker
            context: .
            dockerfile: ./docker/Dockerfile.worker
            repo: erp03-worker
          - name: erp-core
            context: ./erp-core
            dockerfile: ./erp-core/Dockerfile
            repo: erp03-core
          - name: ai
            context: ./erp03/apps/erp
            dockerfile: ./erp03/apps/erp/Dockerfile
            repo: erp03-ai
    steps:
      - uses: actions/checkout@v4
      - id: check-dockerfile
        run: |
          if [ -f "${{ matrix.service.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check-dockerfile.outputs.exists == 'true'
      - uses: docker/login-action@v3
        if: steps.check-dockerfile.outputs.exists == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: meta
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO_PREFIX }}/${{ matrix.service.repo }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v5
        if: steps.check-dockerfile.outputs.exists == 'true'
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      - if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          echo "Pushed: ${{ env.DOCKERHUB_REPO_PREFIX }}/${{ matrix.service.repo }}:${{ github.sha }}"

  postgres-image-build:
    name: PostgreSQL Custom Image
    needs: [changes]
    if: |
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' &&
      (needs.changes.outputs.docker == 'true' || needs.changes.outputs.any == 'true')
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: check-postgres
        run: |
          if [ -f "INFRASTRUCTURE/postgres/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check-postgres.outputs.exists == 'true'
      - uses: docker/login-action@v3
        if: steps.check-postgres.outputs.exists == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v5
        if: steps.check-postgres.outputs.exists == 'true'
        with:
          context: ./INFRASTRUCTURE/postgres
          file: ./INFRASTRUCTURE/postgres/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-psql:latest
            ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-psql:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - erp03-frontend
          - erp03-backend
          - erp03-worker
          - erp03-core
          - erp03-ai
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_REPO_PREFIX }}/${{ matrix.image }}:latest
          format: sarif
          output: trivy-results-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  deploy-notification:
    name: Deployment Notification
    needs: [docker-build-push, security-scan, postgres-image-build]
    if: always() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "=========================================="
          echo "  ERP03 CI/CD Pipeline COMPLETED"
          echo "=========================================="
          echo "Images pushed:"
          echo "  - ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-frontend:latest"
          echo "  - ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-backend:latest"
          echo "  - ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-worker:latest"
          echo "  - ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-core:latest"
          echo "  - ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-ai:latest"
          echo "  - ${{ env.DOCKERHUB_REPO_PREFIX }}/erp03-psql:latest (if custom)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "=========================================="
