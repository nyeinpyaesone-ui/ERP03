name: Complete CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  attestations: write
  id-token: write

jobs:
  # Stage 1: Security & Quality Gates
  security-scan:
    name: Security Scanning
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      fail-on-severity: high
      languages: '["python", "javascript-typescript"]'
      scan-dependencies: ${{ github.event_name == 'pull_request' }}
      scan-codeql: true
      scan-secrets: true

  # Stage 2: Build & Test
  build-and-test:
    name: Build and Test
    needs: security-scan
    if: always() && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    uses: ./.github/workflows/reusable/build-and-test.yml
    with:
      python-version: '3.11'
      run-tests: true
      validate-compose: true

  # Stage 3: Integration Tests (with database)
  integration-tests:
    name: Integration Tests
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt

      - name: Install dependencies
        working-directory: ERP-BACKEND
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov

      - name: Run migrations
        working-directory: ERP-BACKEND
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          python -m alembic upgrade head

      - name: Run integration tests
        working-directory: ERP-BACKEND
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          python -m pytest tests/integration/ -v --cov=app --cov-report=xml || echo "No integration tests yet"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./ERP-BACKEND/coverage.xml
          flags: integration

  # Stage 4: Publish to GHCR (main branch only)
  publish-ghcr:
    name: Publish to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/docker-publish.yml
    with:
      registry: ghcr.io
      repository-owner: ${{ github.repository_owner }}
      image-tag: ${{ github.sha }}
      push: true
      create-provenance: true
      create-sbom: true
    secrets: inherit

  # Stage 5: Release Images (tags only)
  publish-release:
    name: Publish Release Images
    needs: build-and-test
    if: github.event_name == 'release'
    uses: ./.github/workflows/reusable/docker-publish.yml
    with:
      registry: ghcr.io
      repository-owner: ${{ github.repository_owner }}
      image-tag: ${{ github.ref_name }}
      push: true
      create-provenance: true
      create-sbom: true
    secrets: inherit

  # Summary job
  pipeline-summary:
    name: Pipeline Summary
    needs: [security-scan, build-and-test, integration-tests, publish-ghcr, publish-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## CI/CD Pipeline Summary"
          echo "- Security Scan: ${{ needs.security-scan.result }}"
          echo "- Build & Test: ${{ needs.build-and-test.result }}"
          echo "- Integration Tests: ${{ needs.integration-tests.result }}"
          echo "- GHCR Publish: ${{ needs.publish-ghcr.result }}"
          echo "- Release Publish: ${{ needs.publish-release.result }}"
          
          if [[ "${{ needs.publish-release.result }}" == "success" ]]; then
            echo "✅ Release pipeline completed successfully!"
          elif [[ "${{ needs.publish-ghcr.result }}" == "success" ]]; then
            echo "✅ Main branch pipeline completed successfully!"
          else
            echo "❌ Pipeline failed or incomplete"
            exit 1
          fi
