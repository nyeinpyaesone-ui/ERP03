name: ERP03 ERPNext Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_ERPNext: powerrangeranikg/erp03-erpnext
  IMAGE_NGINX: powerrangeranikg/erp03-erpnext-nginx

jobs:
  validate:
    name: Validate isolated ERPNext deployment
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate compose file
        run: docker compose -f docker-compose.erpnext.prod.yml config
      - name: Validate required deployment files
        run: |
          test -f docker/erpnext/Dockerfile
          test -f docker/erpnext/production-entrypoint.sh
          test -f docker/nginx/Dockerfile
          test -f docker/nginx/nginx.conf
      - name: Validate action pinning
        shell: bash
        run: |
          if grep -REn 'uses: [^[:space:]@]+@(v|master|main|[0-9]+\.[0-9]+\.[0-9]+)$' .github/workflows; then
            echo 'Unpinned GitHub Action detected.'
            exit 1
          fi

  build:
    name: Build ERPNext images
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: erpnext
            image: powerrangeranikg/erp03-erpnext
            context: .
            dockerfile: docker/erpnext/Dockerfile
          - name: nginx
            image: powerrangeranikg/erp03-erpnext-nginx
            context: .
            dockerfile: docker/nginx/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: powerrangeranikg
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
