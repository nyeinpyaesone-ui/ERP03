name: ERP03 ERPNext Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_ERPNext: erpnext:production
  IMAGE_NGINX: erpnext-nginx:production

jobs:
  validate:
    name: Validate isolated ERPNext deployment
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository without submodule initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate compose file
        env:
          SITE_NAME: erpnext.local
          DB_HOST: mariadb.example.internal
          DB_PORT: "3306"
          DB_ROOT_USER: root
          DB_ROOT_PASSWORD: ci-validation-only
          ADMIN_PASSWORD: ci-validation-only
          REDIS_CACHE: redis://redis.example.internal:6379
          REDIS_QUEUE: redis://redis.example.internal:6379
          REDIS_SOCKETIO: redis://redis.example.internal:6379
        run: |
          set -euo pipefail
          docker compose -f docker-compose.erpnext.prod.yml config --quiet
      - name: Validate required deployment files
        run: |
          set -euo pipefail
          test -f docker/erpnext/Dockerfile
          test -f docker/erpnext/production-entrypoint.sh
          test -f docker/nginx/Dockerfile
          test -f docker/nginx/nginx.conf
      - name: Validate action pinning
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn 'uses: [^[:space:]@]+@(v|master|main|[0-9]+\.[0-9]+\.[0-9]+)$' .github/workflows; then
            echo 'Unpinned GitHub Action detected.'
            exit 1
          fi

  build:
    name: Build ERPNext images
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: erpnext
            image: erpnext:production
            context: .
            dockerfile: docker/erpnext/Dockerfile
          - name: nginx
            image: erpnext-nginx:production
            context: .
            dockerfile: docker/nginx/Dockerfile
    steps:
      - name: Checkout repository without submodule initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build production image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Inspect built image
        run: docker image inspect "${{ matrix.image }}" >/dev/null
