name: Complete CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  attestations: write
  id-token: write

jobs:
  # Stage 1: Security & Quality Gates
  security-scan:
    name: Security Scanning
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      fail-on-severity: high
      languages: '["python", "javascript-typescript"]'
      scan-dependencies: ${{ github.event_name == 'pull_request' }}
      scan-codeql: true
      scan-secrets: true

  # Stage 2: Build & Test
  build-and-test:
    name: Build and Test
    needs: security-scan
    if: always() && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    uses: ./.github/workflows/reusable/build-and-test.yml
    with:
      python-version: '3.11'
      run-tests: true
      validate-compose: true

  # Stage 3: Integration Tests (with database)
  integration-tests:
    name: Integration Tests
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt

      - name: Install dependencies
        working-directory: ERP-BACKEND
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov

      - name: Run integration tests
        working-directory: ERP-BACKEND
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          INTEGRATION_SERVICE: http://localhost:8001
        run: |
          python -m pytest tests/test_integration_v1.py -v --cov=integration --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./ERP-BACKEND/coverage.xml
          flags: integration

  # Stage 4: Publish to GHCR (main branch only)
  publish-ghcr:
    name: Publish to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/docker-publish.yml
    with:
      registry: ghcr.io
      repository-owner: ${{ github.repository_owner }}
      image-tag: ${{ github.sha }}
      push: true
      create-provenance: true
      create-sbom: true
    secrets: inherit

  # Stage 5: Deploy to Staging (after GHCR publish)
  deploy-staging:
    name: Deploy to Staging
    needs: [publish-ghcr, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images in staging
        run: |
          echo "Deploying backend: ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.sha }}"
          echo "Deploying frontend: ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.sha }}"
          # Add actual deployment commands here (kubectl, docker-compose, etc.)
          # kubectl set image deployment/backend backend=ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.sha }}
          # kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.sha }}

      - name: Verify staging deployment
        run: |
          echo "Verifying staging environment..."
          # Add health check commands here
          # curl -f https://staging.example.com/health || exit 1

  # Stage 6: Release Images (tags only)
  publish-release:
    name: Publish Release Images
    needs: build-and-test
    if: github.event_name == 'release'
    uses: ./.github/workflows/reusable/docker-publish.yml
    with:
      registry: ghcr.io
      repository-owner: ${{ github.repository_owner }}
      image-tag: ${{ github.ref_name }}
      push: true
      create-provenance: true
      create-sbom: true
    secrets: inherit

  # Stage 7: Deploy to Production (manual approval)
  deploy-production:
    name: Deploy to Production
    needs: [publish-release, deploy-staging]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          echo "Deploying release ${{ github.ref_name }} to production"
          echo "Backend: ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.ref_name }}"
          echo "Frontend: ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.ref_name }}"
          # Add actual deployment commands here
          # kubectl set image deployment/backend backend=ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.ref_name }}
          # kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.ref_name }}

      - name: Verify production deployment
        run: |
          echo "Verifying production environment..."
          # Add health check commands here
          # curl -f https://api.example.com/health || exit 1

  # Summary job
  pipeline-summary:
    name: Pipeline Summary
    needs: [security-scan, build-and-test, integration-tests, publish-ghcr, deploy-staging, publish-release, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## CI/CD Pipeline Summary"
          echo "- Security Scan: ${{ needs.security-scan.result }}"
          echo "- Build & Test: ${{ needs.build-and-test.result }}"
          echo "- Integration Tests: ${{ needs.integration-tests.result }}"
          echo "- GHCR Publish: ${{ needs.publish-ghcr.result }}"
          echo "- Staging Deploy: ${{ needs.deploy-staging.result }}"
          echo "- Release Publish: ${{ needs.publish-release.result }}"
          echo "- Production Deploy: ${{ needs.deploy-production.result }}"
          
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Pipeline completed successfully!"
          elif [[ "${{ needs.deploy-production.result }}" == "skipped" && "${{ needs.publish-ghcr.result }}" == "success" ]]; then
            echo "✅ PR/feature branch pipeline completed successfully!"
          else
            echo "❌ Pipeline failed or incomplete"
            exit 1
          fi
