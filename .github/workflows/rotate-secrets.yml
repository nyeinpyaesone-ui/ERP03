name: Rotate Secrets

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  rotate-secret-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate new SECRET_KEY
        run: |
          NEW_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          echo "NEW_SECRET_KEY=$NEW_KEY" >> "$GITHUB_ENV"

      - name: Update GitHub secret
        run: |
          if [[ -z "${{ secrets.REPO_ADMIN_PAT }}" ]]; then
            echo "WARNING: REPO_ADMIN_PAT not configured; skipping GitHub secret update."
            echo "Set REPO_ADMIN_PAT (PAT with 'repo' scope) to enable automatic rotation."
            exit 0
          fi
          echo "${{ secrets.REPO_ADMIN_PAT }}" | gh auth login --with-token
          gh secret set SECRET_KEY -b "${NEW_SECRET_KEY}"
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}

      - name: Notify rotation
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: "#alerts"
          slack-message: "🔐 SECRET_KEY rotated automatically"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
