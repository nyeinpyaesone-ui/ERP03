name: Secret Rotation (Disabled Safely)

# SECRET_KEY signs HS256 access tokens. Replacing it without a verification-key
# overlap and coordinated rollout immediately invalidates previously issued tokens.
# This workflow is deliberately manual and read-only until that support exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation-disabled:
    name: Confirm automated rotation remains disabled
    runs-on: ubuntu-latest
    steps:
      - name: Record safety status
        run: |
          {
            echo "## Secret rotation status"
            echo
            echo "- Automated rotation is disabled."
            echo "- No secret was generated, read, changed, or transmitted."
            echo "- SECRET_KEY rotation requires application support for overlapping verification keys, a coordinated rollout, and a tested rollback procedure."
            echo "- This workflow is an audit acknowledgement only; it does not perform rotation."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Secret rotation is intentionally disabled; no credentials were modified."
