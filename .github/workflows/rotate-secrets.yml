name: Rotate Secrets

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  rotate-secret-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate new SECRET_KEY
        run: |
          NEW_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          echo "NEW_SECRET_KEY=$NEW_KEY" >> "$GITHUB_ENV"
      - name: Update GitHub secret
        run: |
          gh secret set SECRET_KEY -b "${{ env.NEW_SECRET_KEY }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify rotation
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844
        with:
          channel-id: "#alerts"
          slack-message: "🔐 SECRET_KEY rotated automatically"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
