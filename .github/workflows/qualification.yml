name: ERP03 Qualification

on:
  push:
    branches: [main, rewrite/production-erp-foundation]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ERP-BACKEND
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp03
          POSTGRES_USER: erp03
          POSTGRES_PASSWORD: erp03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp03 -d erp03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic
      - run: DATABASE_URL=postgresql+asyncpg://erp03:erp03@127.0.0.1:5432/erp03 alembic upgrade head
      - run: DATABASE_URL=postgresql+asyncpg://erp03:erp03@127.0.0.1:5432/erp03 pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
