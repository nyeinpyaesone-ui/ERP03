name: 🔄 Repository Lifecycle Management CI/CD

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'rlm-service/**'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'rlm-service/**'
  workflow_dispatch:

env:
  SERVICE_NAME: rlm-service
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rlm-service

jobs:
  # Phase 1: Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rlm-service/package-lock.json

      - name: Install dependencies
        working-directory: ./rlm-service
        run: npm ci

      - name: Run ESLint
        working-directory: ./rlm-service
        run: npm run lint -- --max-warnings=0

      - name: Type check
        working-directory: ./rlm-service
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./rlm-service
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":85}}'

  # Phase 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Audit npm dependencies
        working-directory: ./rlm-service
        run: npm audit --audit-level=high

  # Phase 3: Build and Push (only on main/develop)
  build-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: [quality-gate, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
      
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push multi-platform
        uses: docker/build-push-action@v5
        with:
          context: ./rlm-service
          file: ./rlm-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  # Phase 4: Deploy to Staging (auto on develop)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying RLM Service to staging environment"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add kubectl/helm deployment commands here

  # Phase 5: Deploy to Production (manual approval on main)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 30
    
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying RLM Service to production environment"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add kubectl/helm deployment commands here
          
      - name: Verify deployment
        run: |
          echo "✅ Verifying production deployment health"
          # Add health check verification commands here
