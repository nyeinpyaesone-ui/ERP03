name: M1 Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "ERP-BACKEND/**"
      - ".github/workflows/m1-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp03_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d erp03_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: ERP-BACKEND

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Upgrade database to Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/erp03_test
          SECRET_KEY: 12345678901234567890123456789012
          TEST_MODE: "false"
        run: alembic upgrade head

      - name: Verify Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/erp03_test
          SECRET_KEY: 12345678901234567890123456789012
          TEST_MODE: "false"
        run: alembic current

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/erp03_test
          SECRET_KEY: 12345678901234567890123456789012
          TEST_MODE: "true"
          AUTO_CREATE_TABLES: "false"
        run: pytest tests/ -v --tb=short
