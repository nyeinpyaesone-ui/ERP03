name: Release Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable release images
    runs-on: ubuntu-latest
    environment: Docker01
    outputs:
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_digest: ${{ steps.backend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish ERP backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging-gate:
    name: Staging approval gate
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Record release digests
        run: |
          echo "Frontend digest: ${{ needs.publish.outputs.frontend_digest }}"
          echo "ERP backend digest: ${{ needs.publish.outputs.backend_digest }}"
          echo "Staging must consume the exact published release images."

  production-gate:
    name: Production approval gate
    needs: staging-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm production promotion boundary
        run: |
          echo "Production environment approval passed."
          echo "Deployment must consume the exact approved release image digests."
