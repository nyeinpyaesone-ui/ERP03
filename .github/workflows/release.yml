name: Release Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable release images
    runs-on: ubuntu-latest
    environment: Docker01
    outputs:
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_digest: ${{ steps.backend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker01 configuration
        env:
          DOCKER_USER: ${{ secrets.D2_USER }}
          DOCKER_PASS: ${{ secrets.D2_PASS }}
          ERP_CORE_URL: ${{ vars.ERP_CORE }}
          FRONTEND_URL: ${{ vars.FRONTEND }}
          BACKEND_URL: ${{ vars.BACKEND }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USER"
          test -n "$DOCKER_PASS"
          for value in "$ERP_CORE_URL" "$FRONTEND_URL" "$BACKEND_URL"; do
            case "$value" in
              https://hub.docker.com/repository/docker/*/) ;;
              *) echo "Invalid Docker01 Docker Hub repository URL" >&2; exit 1 ;;
            esac
          done
          test "${ERP_CORE_URL#https://hub.docker.com/repository/docker/}" = "powerrangeranikg/erp03/"
          test "${FRONTEND_URL#https://hub.docker.com/repository/docker/}" = "powerrangeranikg/frontend/"
          test "${BACKEND_URL#https://hub.docker.com/repository/docker/}" = "powerrangeranikg/backend/"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.D2_USER }}
          password: ${{ secrets.D2_PASS }}

      - name: Resolve Docker image names
        id: images
        env:
          FRONTEND_URL: ${{ vars.FRONTEND }}
          BACKEND_URL: ${{ vars.BACKEND }}
        run: |
          set -euo pipefail
          erp03="${ERP_CORE_URL#https://hub.docker.com/repository/docker/}"
          erp03="${erp03%/}"
          frontend="${FRONTEND_URL#https://hub.docker.com/repository/docker/}"
          frontend="${frontend%/}"
          backend="${BACKEND_URL#https://hub.docker.com/repository/docker/}"
          backend="${backend%/}"
          {
            echo "frontend=$frontend"
            echo "backend=$backend"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/frontend-react
          file: ./backend/frontend-react/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.ref_name }}
          provenance: true
          sbom: true

  staging-gate:
    name: Staging approval gate
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Record release digests
        run: |
          echo "Frontend digest: ${{ needs.publish.outputs.frontend_digest }}"
          echo "Backend digest: ${{ needs.publish.outputs.backend_digest }}"
          echo "Configure the staging environment's deployment integration to consume these immutable digests."

  production-gate:
    name: Production approval gate
    needs: staging-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm production promotion boundary
        run: |
          echo "Production environment approval passed."
          echo "Deployment must consume the exact approved image digests from the release job."
