name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: Docker01
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.D2_USER }}
          password: ${{ secrets.D2_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate release image configuration
        shell: bash
        env:
          ERP_CORE: ${{ vars.ERP_CORE }}
          BACKEND: ${{ vars.BACKEND }}
          FRONTEND: ${{ vars.FRONTEND }}
        run: |
          set -euo pipefail
          for value in "$ERP_CORE" "$BACKEND" "$FRONTEND"; do
            test -n "$value"
            case "$value" in
              https://hub.docker.com/repository/docker/*) ;;
              *) echo "Invalid Docker Hub repository URL configured" >&2; exit 1 ;;
            esac
          done

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.BACKEND }}:${{ github.ref_name }}
            ${{ vars.BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/frontend-react
          file: ./backend/frontend-react/Dockerfile
          push: true
          tags: |
            ${{ vars.FRONTEND }}:${{ github.ref_name }}
            ${{ vars.FRONTEND }}:latest
