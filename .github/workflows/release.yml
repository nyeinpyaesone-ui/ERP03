name: Release Images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable release images
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT_BACKEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKER_USER }}/erp-solution-backend:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKER_USER }}/erp-solution-frontend:${{ github.ref_name }}
          provenance: true
          sbom: true

  staging-gate:
    name: Staging approval gate
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Record release digests
        run: |
          echo "Backend digest: ${{ needs.publish.outputs.backend_digest }}"
          echo "Frontend digest: ${{ needs.publish.outputs.frontend_digest }}"
          echo "Staging deployment is intentionally not automated until the target deployment endpoint and command are defined."

  production-gate:
    name: Production approval gate
    needs: staging-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm production promotion boundary
        run: |
          echo "Production protection rules passed."
          echo "Production deployment remains intentionally disabled until the approved deployment mechanism is defined."
