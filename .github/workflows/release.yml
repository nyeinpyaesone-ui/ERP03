name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Full CI qualification
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  quality:
    name: Backend quality checks
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  backend-image:
    name: Publish and sign backend image
    needs: [qualification, quality]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml

  frontend-image:
    name: Publish frontend image
    needs: [qualification, quality]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml

  release:
    name: Create GitHub release
    needs: [backend-image, frontend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate changelog
        id: changelog
        uses: scottbrenner/generate-changelog-action@f17b985298496cf8df35aa1104091c51e7bfea95
        with:
          my_token: ${{ github.token }}
          from_tag: ${{ github.event.before }}
          to_tag: ${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true
