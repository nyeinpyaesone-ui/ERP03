name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: Docker01
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.D2_USER }}
          password: ${{ secrets.D2_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.D2_USER }}/backend:${{ github.ref_name }}
            ${{ secrets.D2_USER }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/frontend-react
          file: ./backend/frontend-react/Dockerfile
          push: true
          tags: |
            ${{ secrets.D2_USER }}/frontend:${{ github.ref_name }}
            ${{ secrets.D2_USER }}/frontend:latest
