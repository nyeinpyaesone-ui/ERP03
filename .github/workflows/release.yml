name: Release Images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable release images
    runs-on: ubuntu-latest
    environment: Docker01
    outputs:
      erp03_digest: ${{ steps.erp03.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_digest: ${{ steps.backend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.D2_USER }}
          password: ${{ secrets.D2_PASS }}

      - name: Resolve Docker image names from Docker01 variables
        id: images
        env:
          ERP_CORE_URL: ${{ vars.ERP_CORE }}
          FRONTEND_URL: ${{ vars.FRONTEND }}
          BACKEND_URL: ${{ vars.BACKEND }}
        run: |
          set -euo pipefail
          for value in "$ERP_CORE_URL" "$FRONTEND_URL" "$BACKEND_URL"; do
            case "$value" in
              https://hub.docker.com/repository/docker/*/) ;;
              *) echo "Invalid Docker Hub repository URL: $value" >&2; exit 1 ;;
            esac
          done
          erp03="${ERP_CORE_URL#https://hub.docker.com/repository/docker/}"
          erp03="${erp03%/}"
          frontend="${FRONTEND_URL#https://hub.docker.com/repository/docker/}"
          frontend="${frontend%/}"
          backend="${BACKEND_URL#https://hub.docker.com/repository/docker/}"
          backend="${backend%/}"
          {
            echo "erp03=$erp03"
            echo "frontend=$frontend"
            echo "backend=$backend"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish ERP Core image
        id: erp03
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.images.outputs.erp03 }}:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.ref_name }}
          provenance: true
          sbom: true

  staging-gate:
    name: Staging approval gate
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Record release digests
        run: |
          echo "ERP Core digest: ${{ needs.publish.outputs.erp03_digest }}"
          echo "Frontend digest: ${{ needs.publish.outputs.frontend_digest }}"
          echo "Backend digest: ${{ needs.publish.outputs.backend_digest }}"
          echo "Staging deployment endpoint is intentionally not guessed."

  production-gate:
    name: Production approval gate
    needs: staging-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm production promotion boundary
        run: |
          echo "Production protection rules passed."
          echo "Production deployment remains disabled until the approved deployment mechanism is configured."
