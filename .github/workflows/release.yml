
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # strict semver

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: powerrangeranikg/erp03-backend
  FRONTEND_IMAGE: powerrangeranikg/erp03-frontend
  # optionally AI_IMAGE: powerrangeranikg/erp03-ai

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-qemu-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          username: ${{ secrets.D2_USER }}
          password: ${{ secrets.D2_PASS }}
      - name: Meta backend
        id: meta_backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ github.ref_name }}
      - uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true
      - name: Meta frontend
        id: meta_frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ github.ref_name }}
      - uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    if: startsWith(github.ref_name, 'v') && !endsWith(github.ref_name, '-test')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose-plugin
      - name: Set up SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ vars.DEPLOY_PATH || '/opt/erp03' }}
            docker login -u ${{ secrets.D2_USER }} -p ${{ secrets.D2_PASS }}
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f
            sleep 10
            curl -f http://localhost:8000/health || exit 1
          EOF
