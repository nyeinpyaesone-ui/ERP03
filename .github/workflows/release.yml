name: ERP03 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_USERNAME: powerrangeranikg
  DOCKERHUB_REPO_PREFIX: powerrangeranikg

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          echo "Version valid: $VERSION"
      - run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if ! grep -q "$VERSION" CHANGELOG.md; then
            echo "Warning: $VERSION not in CHANGELOG.md"
          fi

  release-images:
    name: Build Release Images
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            repo: erp03-frontend
          - name: backend
            context: ./ERP-BACKEND
            dockerfile: ./ERP-BACKEND/Dockerfile
            repo: erp03-backend
          - name: worker
            context: .
            dockerfile: ./docker/Dockerfile.worker
            repo: erp03-worker
          - name: erp-core
            context: ./erp-core
            dockerfile: ./erp-core/Dockerfile
            repo: erp03-core
          - name: ai
            context: ./erp03/apps/erp
            dockerfile: ./erp03/apps/erp/Dockerfile
            repo: erp03-ai
    steps:
      - uses: actions/checkout@v4
      - id: check-dockerfile
        run: |
          if [ -f "${{ matrix.service.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check-dockerfile.outputs.exists == 'true'
      - uses: docker/login-action@v3
        if: steps.check-dockerfile.outputs.exists == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: version
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        if: steps.check-dockerfile.outputs.exists == 'true'
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_PREFIX }}/${{ matrix.service.repo }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKERHUB_REPO_PREFIX }}/${{ matrix.service.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    name: Generate Release Notes
    needs: [validate, release-images]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "## Changes in $VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: $PREVIOUS_TAG...$VERSION" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "### Commits" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> RELEASE_NOTES.md
          else
            echo "### Commits" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "### Docker Images" >> RELEASE_NOTES.md
          echo "- powerrangeranikg/erp03-frontend:$VERSION" >> RELEASE_NOTES.md
          echo "- powerrangeranikg/erp03-backend:$VERSION" >> RELEASE_NOTES.md
          echo "- powerrangeranikg/erp03-worker:$VERSION" >> RELEASE_NOTES.md
          echo "- powerrangeranikg/erp03-core:$VERSION" >> RELEASE_NOTES.md
          echo "- powerrangeranikg/erp03-ai:$VERSION" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-dockerhub:
    name: Update DockerHub README
    needs: release-images
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        repo:
          - erp03-frontend
          - erp03-backend
          - erp03-worker
          - erp03-core
          - erp03-ai
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.DOCKERHUB_REPO_PREFIX }}/${{ matrix.repo }}
          readme-filepath: ./README.md
          short-description: "ERP03 Enterprise Resource Planning Platform - ${{ matrix.repo }}"
