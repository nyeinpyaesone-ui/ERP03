name: Release Images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_USER: powerrangeranikg
  IMAGE_NAMESPACE: powerrangeranikg

jobs:
  publish:
    name: Build and publish immutable release images
    runs-on: ubuntu-latest
    outputs:
      erp03_digest: ${{ steps.erp03.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_digest: ${{ steps.backend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish ERP03 image
        id: erp03
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/erp03:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.ref_name }}
          provenance: true
          sbom: true

  staging-gate:
    name: Staging approval gate
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Record release digests
        run: |
          echo "ERP03 digest: ${{ needs.publish.outputs.erp03_digest }}"
          echo "Frontend digest: ${{ needs.publish.outputs.frontend_digest }}"
          echo "Backend digest: ${{ needs.publish.outputs.backend_digest }}"
          echo "Staging deployment endpoint is intentionally not guessed."

  production-gate:
    name: Production approval gate
    needs: staging-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm production promotion boundary
        run: |
          echo "Production protection rules passed."
          echo "Production deployment remains disabled until the approved deployment mechanism is configured."
