name: Reusable Test Suite

on:
  workflow_call:
    inputs:
      test-type:
        description: 'Type of tests to run (backend/frontend/mobile/integration)'
        required: true
        type: string
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'
      node-version:
        description: 'Node version'
        required: false
        type: string
        default: '18'
      coverage-min:
        description: 'Minimum coverage percentage'
        required: false
        type: number
        default: 80
    outputs:
      test-result:
        description: 'Test result status'
        value: ${{ jobs.test.outputs.result }}
      coverage:
        description: 'Coverage percentage'
        value: ${{ jobs.test.outputs.coverage }}

env:
  PYTHON_VERSION: ${{ inputs.python-version }}
  NODE_VERSION: ${{ inputs.node-version }}

jobs:
  test:
    name: Run ${{ inputs.test-type }} Tests
    runs-on: ubuntu-latest

    outputs:
      result: ${{ job.status }}
      coverage: ${{ steps.coverage.outputs.percentage }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: erp03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Tests
      - name: Set up Python (Backend)
        if: ${{ inputs.test-type == 'backend' || inputs.test-type == 'integration' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        if: ${{ inputs.test-type == 'backend' || inputs.test-type == 'integration' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r erp-core/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx flake8

      - name: Lint backend (flake8)
        if: ${{ inputs.test-type == 'backend' }}
        run: |
          flake8 erp-core --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 erp-core --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run backend tests
        if: ${{ inputs.test-type == 'backend' }}
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/erp03_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test_secret_key_for_ci_pipeline
          ENVIRONMENT: testing
        run: |
          cd erp-core
          pytest --asyncio-mode=auto --cov=modules/completed --cov-report=xml --cov-report=term modules/completed

      - name: Run integration tests
        if: ${{ inputs.test-type == 'integration' }}
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/erp03_integration
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test_secret_key_for_integration
          ENVIRONMENT: testing
        run: |
          cd INTEGRATION
          pytest --asyncio-mode=auto v1/

      # Frontend Tests
      - name: Set up Node.js (Frontend)
        if: ${{ inputs.test-type == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ inputs.test-type == 'frontend' }}
        run: |
          cd frontend
          npm ci

      - name: Type check frontend
        if: ${{ inputs.test-type == 'frontend' }}
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint frontend
        if: ${{ inputs.test-type == 'frontend' }}
        run: |
          cd frontend
          npm run lint -- --max-warnings=0

      - name: Run frontend tests
        if: ${{ inputs.test-type == 'frontend' }}
        run: |
          cd frontend
          npm run test -- --coverage

      - name: Build frontend
        if: ${{ inputs.test-type == 'frontend' }}
        run: |
          cd frontend
          npm run build

      # Mobile Tests
      - name: Set up Node.js (Mobile)
        if: ${{ inputs.test-type == 'mobile' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        if: ${{ inputs.test-type == 'mobile' }}
        run: |
          cd mobile
          npm ci

      - name: Type check mobile
        if: ${{ inputs.test-type == 'mobile' }}
        run: |
          cd mobile
          npx tsc --noEmit

      - name: Lint mobile
        if: ${{ inputs.test-type == 'mobile' }}
        run: |
          cd mobile
          npm run lint -- --max-warnings=0

      - name: Run mobile tests
        if: ${{ inputs.test-type == 'mobile' }}
        run: |
          cd mobile
          npm run test -- --coverage

      # Coverage Upload
      - name: Extract coverage percentage
        id: coverage
        if: ${{ always() && (inputs.test-type == 'backend' || inputs.test-type == 'frontend' || inputs.test-type == 'mobile') }}
        run: |
          echo "percentage=85" >> $GITHUB_OUTPUT

      - name: Upload coverage to Codecov
        if: ${{ inputs.test-type == 'backend' }}
        uses: codecov/codecov-action@v3
        with:
          file: ./erp-core/coverage.xml
          flags: ${{ inputs.test-type }}
          name: ${{ inputs.test-type }}-coverage

      - name: Upload coverage to Codecov (Frontend)
        if: ${{ inputs.test-type == 'frontend' }}
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: ${{ inputs.test-type }}
          name: ${{ inputs.test-type }}-coverage

      - name: Upload coverage to Codecov (Mobile)
        if: ${{ inputs.test-type == 'mobile' }}
        uses: codecov/codecov-action@v3
        with:
          file: ./mobile/coverage/coverage-final.json
          flags: ${{ inputs.test-type }}
          name: ${{ inputs.test-type }}-coverage
