name: Type Check

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ERP-BACKEND/requirements.txt
          pip install -r ERP-BACKEND/dev-requirements.txt

      - name: Run mypy
        run: |
          cd ERP-BACKEND
          python -m mypy app/ --ignore-missing-imports --no-error-summary 2>&1 | head -50 || true
        continue-on-error: true
