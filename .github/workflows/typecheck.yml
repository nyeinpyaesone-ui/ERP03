name: Type Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ERP-BACKEND/requirements.txt
            ERP-BACKEND/dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ERP-BACKEND/requirements.txt
          pip install -r ERP-BACKEND/dev-requirements.txt

      - name: Run mypy
        run: |
          cd ERP-BACKEND
          python -m mypy app/ --ignore-missing-imports --no-error-summary
