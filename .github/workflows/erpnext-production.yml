name: ERPNext Production Image

on:
  push:
    branches:
      - feat/erpnext-production
    paths-ignore:
      - infra/erpnext/gitops/kustomization.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/erp03-erpnext
  FRAPPE_BRANCH: v16.31.1
  FRAPPE_DOCKER_REF: d4a310089f5d6fc38ed1317b898d75b9c74901db

jobs:
  build-scan-publish:
    name: Build, scan, publish, and promote ERPNext
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ERP03
        uses: actions/checkout@v5

      - name: Validate apps.json
        run: python -m json.tool infra/erpnext/apps.json >/dev/null

      - name: Checkout immutable official Frappe Docker
        uses: actions/checkout@v5
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          load: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.sha }}
          secrets: |
            apps_json=${{ github.workspace }}/infra/erpnext/apps.json
          tags: erp03-erpnext:${{ github.sha }}
          cache-from: type=gha,scope=erpnext
          cache-to: type=gha,mode=max,scope=erpnext
          provenance: true
          sbom: true

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: erp03-erpnext:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: erp03-erpnext:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8
        with:
          sarif_file: trivy-results.sarif

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.sha }}
          secrets: |
            apps_json=${{ github.workspace }}/infra/erpnext/apps.json
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=erpnext
          cache-to: type=gha,mode=max,scope=erpnext
          provenance: true
          sbom: true

      - name: Resolve published image digest
        id: image-digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_REF" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          case "$digest" in
            sha256:*) ;;
            *) echo "Unexpected image digest: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Promote immutable image digest into GitOps
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path("infra/erpnext/gitops/kustomization.yaml")
          text = p.read_text()
          old = "    digest: IMAGE_DIGEST"
          new = f"    digest: {os.environ['IMAGE_DIGEST']}"
          if old not in text:
              raise SystemExit("expected IMAGE_DIGEST placeholder not found")
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/erpnext/gitops/kustomization.yaml
          git commit -m "chore(gitops): promote ERPNext image digest $IMAGE_DIGEST"
          git push origin HEAD:feat/erpnext-production
