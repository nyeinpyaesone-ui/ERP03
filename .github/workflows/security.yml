name: Security

on:
  pull_request:
    paths:
      - 'ERP-BACKEND/**'
      - 'AI-BACKEND/**'
      - '**/package*.json'
      - '**/requirements*.txt'
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/dependency-review-action@29a786fbc64a2138a29d614ef883983e4cf631e6

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: python, javascript
          # Don't run autobuild for JS – we'll just analyze the source
          build-mode: none
      - uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@1938557f6a58837331b99822ab17b8e536e7bef9  # commit SHA of the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
