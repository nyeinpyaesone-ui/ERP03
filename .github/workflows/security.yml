name: Security

on:
  pull_request:
    paths:
      - 'ERP-BACKEND/**'
      - 'AI-BACKEND/**'
      - '**/package*.json'
      - '**/requirements*.txt'
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:   # added for manual trigger

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/dependency-review-action@29a786fbc64a2138a29d614ef883983e4cf631e6 # v4.8.0

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          languages: python, javascript
      - uses: github/codeql-action/autobuild@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
      - uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@65aa59d8c2e97dee44bf56a0c23e2079719c7d6f # v2.3.0 (correct SHA)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
