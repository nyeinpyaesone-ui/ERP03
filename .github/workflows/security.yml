name: ERP03 Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        if: matrix.language == 'python' || matrix.language == 'javascript'
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/dependency-review-action@38ecb5b593bf0eb19e335c03f97670f792489a8b
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        requirements:
          - ERP-BACKEND/requirements.txt
          - erp-core/requirements.txt
          - erp03/apps/erp/requirements.txt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: |
          if [ -f "${{ matrix.requirements }}" ]; then
            pip-audit -r ${{ matrix.requirements }} --desc --format=json || true
          else
            echo "File not found: ${{ matrix.requirements }}"
          fi

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        app:
          - path: frontend
            name: Frontend
          - path: mobile
            name: Mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json
      - working-directory: ${{ matrix.app.path }}
        run: npm audit --audit-level=high || true

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - path: ./frontend/Dockerfile
            name: frontend
          - path: ./ERP-BACKEND/Dockerfile
            name: backend
          - path: ./docker/Dockerfile.worker
            name: worker
          - path: ./erp-core/Dockerfile
            name: erp-core
          - path: ./erp03/apps/erp/Dockerfile
            name: erp03-ai
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: check
        run: |
          if [ -f "${{ matrix.dockerfile.path }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        if: steps.check.outputs.exists == 'true'
        with:
          dockerfile: ${{ matrix.dockerfile.path }}
          format: sarif
          output-file: hadolint-${{ matrix.dockerfile.name }}.sarif
          no-fail: true
      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        if: steps.check.outputs.exists == 'true'
        with:
          sarif_file: hadolint-${{ matrix.dockerfile.name }}.sarif
          category: hadolint-${{ matrix.dockerfile.name }}
