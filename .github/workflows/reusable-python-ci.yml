name: Reusable Python CI
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.11'
      run-tests:
        required: false
        type: boolean
        default: true
      test-database-url:
        required: false
        type: string
        default: ''
jobs:
  python-ci:
    name: Python CI (${{ inputs.working-directory }})
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt
      - working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - working-directory: ${{ inputs.working-directory }}
        run: |
          pip install ruff
          ruff check . --output-format=github
      - if: ${{ inputs.run-tests }}
        working-directory: ${{ inputs.working-directory }}
        env:
          DATABASE_URL: ${{ inputs.test-database-url }}
        run: |
          pip install pytest pytest-cov
          pytest --cov=app --cov-report=xml -v || true
      - if: ${{ inputs.run-tests }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.working-directory }}
          path: ${{ inputs.working-directory }}/coverage.xml
          retention-days: 7
