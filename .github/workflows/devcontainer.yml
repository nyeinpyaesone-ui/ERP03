name: Devcontainer Build & Push

on:
  push:
    branches: [main, develop]
    paths:
      - '.devcontainer/**'
      - 'ERP-BACKEND/**'
      - 'frontend/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'ERP-BACKEND/**'
      - 'frontend/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-devcontainer:
    name: Build multi-architecture devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/erp03-devcontainer
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push devcontainer
        id: build-devcontainer-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,mode=max,scope=devcontainer
          provenance: mode=max
          sbom: true

      - name: Verify devcontainer manifest architectures
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/erp03-devcontainer
          DIGEST: ${{ steps.build-devcontainer-image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect --raw "${IMAGE_REF}@${DIGEST}" |
            jq -e '[.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))] | map(.architecture) | unique | length == 2' >/dev/null
          {
            echo "## Devcontainer image publication"
            echo
            echo "- Image: ${IMAGE_REF}"
            echo "- Digest: ${DIGEST}"
            echo "- Verified platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

  build-dev-backend:
    name: Build multi-architecture backend development image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend development image
        id: build-backend-dev-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp03-backend:dev
            ghcr.io/${{ github.repository_owner }}/erp03-backend:dev-${{ github.sha }}
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev
          provenance: mode=max
          sbom: true

      - name: Verify backend development manifest architectures
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/erp03-backend
          DIGEST: ${{ steps.build-backend-dev-image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect --raw "${IMAGE_REF}@${DIGEST}" |
            jq -e '[.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))] | map(.architecture) | unique | length == 2' >/dev/null
          {
            echo "## Backend development image publication"
            echo
            echo "- Image: ${IMAGE_REF}"
            echo "- Digest: ${DIGEST}"
            echo "- Verified platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

  build-dev-frontend:
    name: Build multi-architecture frontend development image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend development image
        id: build-frontend-dev-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp03-frontend:dev
            ghcr.io/${{ github.repository_owner }}/erp03-frontend:dev-${{ github.sha }}
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,mode=max,scope=frontend-dev
          provenance: mode=max
          sbom: true
      
      - name: Verify frontend development manifest architectures
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/erp03-frontend
          DIGEST: ${{ steps.build-frontend-dev-image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect --raw "${IMAGE_REF}@${DIGEST}" |
            jq -e '[.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))] | map(.architecture) | unique | length == 2' >/dev/null
          {
            echo "## Frontend development image publication"
            echo
            echo "- Image: ${IMAGE_REF}"
            echo "- Digest: ${DIGEST}"
            echo "- Verified platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

