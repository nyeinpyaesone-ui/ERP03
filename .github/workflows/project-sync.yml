name: 🔄 Enterprise Project Sync

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, labeled, converted_to_draft, ready_for_review]

jobs:
  track-work:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.ENTERPRISE_APP_ID }}
          private_key: ${{ secrets.ENTERPRISE_APP_PRIVATE_KEY }}

      - name: Add Issue/PR to Project #29
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/nyeinpyaesone-ui/projects/29
          github-token: ${{ steps.generate_token.outputs.token }}
          labeled: bug, enhancement, documentation, epic, feature
          label-operator: OR

      - name: Log project sync status
        run: |
          echo "✅ Added ${{ github.event_name == 'issues' && 'issue' || 'PR' }} #${{ github.event_name == 'issues' && github.event.issue.number || github.event.pull_request.number }} to Project #29"
          echo "   Action: ${{ github.event.action }}"
          echo "   Labels: ${{ toJSON(github.event_name == 'issues' && github.event.issue.labels || github.event.pull_request.labels) }}"
