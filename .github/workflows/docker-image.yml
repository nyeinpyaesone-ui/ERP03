name: Container Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build ERP backend image
        run: docker build ./ERP-BACKEND -f ./ERP-BACKEND/Dockerfile -t erp03-backend:ci

      - name: Build ERP frontend image
        run: docker build ./ERP-BACKEND/frontend-react -f ./ERP-BACKEND/frontend-react/Dockerfile -t erp03-frontend:ci
