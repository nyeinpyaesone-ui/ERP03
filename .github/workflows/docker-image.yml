name: Container Build and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-build-test:
    name: CI Build and Test
    uses: ./.github/workflows/reusable/build-and-test.yml
    with:
      python-version: '3.11'
      run-tests: true
      validate-compose: true

  publish-main:
    name: Publish ERP03 images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-build-test
    uses: ./.github/workflows/reusable/docker-publish.yml
    with:
      registry: ghcr.io
      repository-owner: ${{ github.repository_owner }}
      image-tag: ${{ github.sha }}
      push: true
      create-provenance: true
      create-sbom: true
    secrets: inherit

  verify-published:
    name: Verify GHCR release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-main
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify backend artifact
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.sha }}

      - name: Verify frontend artifact
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.sha }}
