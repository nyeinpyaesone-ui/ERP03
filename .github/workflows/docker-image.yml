name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: powerrangeranikg/erp03-backend
  FRONTEND_IMAGE: powerrangeranikg/erp03-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-qemu-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          username: ${{ secrets.D2_USER }}
          password: ${{ secrets.D2_PASS }}

      - name: Metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true

      - name: Metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@676cae2f85471aeff6776463c72881ebd902dcf9
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          attestations: |
            type=sbom,enabled=true
            type=provenance,enabled=true
