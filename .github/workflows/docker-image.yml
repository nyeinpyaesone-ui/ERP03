name: Container Build and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build ERP03 images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ERP backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          push: false
          tags: erp03-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ERP frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          push: false
          tags: erp03-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-main:
    name: Publish immutable main images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish ERP backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp03-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/erp03-backend:main
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish ERP frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp03-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/erp03-frontend:main
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
