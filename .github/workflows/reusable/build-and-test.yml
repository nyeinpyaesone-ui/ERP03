name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: string
      run-tests:
        description: 'Whether to run tests'
        required: false
        default: true
        type: boolean
      validate-compose:
        description: 'Whether to validate docker compose configuration'
        required: false
        default: true
        type: boolean
    outputs:
      backend-image-tag:
        description: 'Backend image tag'
        value: ${{ jobs.build.outputs.backend-image-tag }}
      frontend-image-tag:
        description: 'Frontend image tag'
        value: ${{ jobs.build.outputs.frontend-image-tag }}

jobs:
  test:
    name: Run Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ERP-BACKEND/requirements.txt

      - name: Install backend test dependencies
        working-directory: ERP-BACKEND
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run backend tests
        working-directory: ERP-BACKEND
        run: python -m pytest -q

  validate:
    name: Validate Configuration
    if: inputs.validate-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [test, validate]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    outputs:
      backend-image-tag: ${{ steps.tags.outputs.backend-tag }}
      frontend-image-tag: ${{ steps.tags.outputs.frontend-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          echo "backend-tag=erp03-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend-tag=erp03-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build ERP backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          push: false
          tags: erp03-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ERP frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          push: false
          tags: erp03-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
