name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry to publish to'
        required: false
        default: 'ghcr.io'
        type: string
      repository-owner:
        description: 'Repository owner for image tags'
        required: true
        type: string
      image-tag:
        description: 'Image tag to use (e.g., main, v1.0.0, sha)'
        required: true
        type: string
      push:
        description: 'Whether to push images'
        required: false
        default: true
        type: boolean
      create-provenance:
        description: 'Generate provenance attestation'
        required: false
        default: true
        type: boolean
      create-sbom:
        description: 'Generate SBOM'
        required: false
        default: true
        type: boolean
    outputs:
      backend-digest:
        description: 'Backend image digest'
        value: ${{ jobs.publish.outputs.backend-digest }}
      frontend-digest:
        description: 'Frontend image digest'
        value: ${{ jobs.publish.outputs.frontend-digest }}

jobs:
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish ERP backend image
        id: backend
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND
          file: ./ERP-BACKEND/Dockerfile
          push: true
          tags: |
            ${{ inputs.registry }}/${{ inputs.repository-owner }}/erp03-backend:${{ inputs.image-tag }}
          provenance: ${{ inputs.create-provenance }}
          sbom: ${{ inputs.create-sbom }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish ERP frontend image
        id: frontend
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: ./ERP-BACKEND/frontend-react
          file: ./ERP-BACKEND/frontend-react/Dockerfile
          push: true
          tags: |
            ${{ inputs.registry }}/${{ inputs.repository-owner }}/erp03-frontend:${{ inputs.image-tag }}
          provenance: ${{ inputs.create-provenance }}
          sbom: ${{ inputs.create-sbom }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
