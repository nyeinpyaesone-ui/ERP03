name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: 'Fail on dependency vulnerability severity'
        required: false
        default: 'high'
        type: string
      languages:
        description: 'Languages to scan with CodeQL'
        required: false
        default: '["python", "javascript-typescript"]'
        type: string
      scan-dependencies:
        description: 'Run dependency review'
        required: false
        default: true
        type: boolean
      scan-codeql:
        description: 'Run CodeQL analysis'
        required: false
        default: true
        type: boolean
      scan-secrets:
        description: 'Run secret scanning'
        required: false
        default: true
        type: boolean

jobs:
  dependency-review:
    name: Dependency Review
    if: inputs.scan-dependencies && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}

  codeql:
    name: CodeQL Analysis
    if: inputs.scan-codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret Scan
    if: inputs.scan-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
