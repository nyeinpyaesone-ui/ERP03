name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ============================================================================
  # Backend Tests
  # ============================================================================
  backend-tests:
    name: Backend Tests (ERP-CORE)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: erp03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r erp-core/requirements.txt
          pip install pytest pytest-asyncpytest-cov pytest-mock httpx

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 erp-core --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 erp-core --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/erp03_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test_secret_key_for_ci_pipeline
          ENVIRONMENT: testing
        run: |
          cd erp-core
          pytest --asyncio-mode=auto --cov=modules/completed --cov-report=xml --cov-report=term modules/completed

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./erp-core/coverage.xml
          flags: backend
          name: backend-coverage

  # ============================================================================
  # Frontend Tests
  # ============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint -- --max-warnings=0

      - name: Run tests
        run: |
          cd frontend
          npm run test -- --coverage

      - name: Build application
        run: |
          cd frontend
          npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ============================================================================
  # Mobile Tests
  # ============================================================================
  mobile-tests:
    name: Mobile Tests (React Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci

      - name: Type check
        run: |
          cd mobile
          npx tsc --noEmit

      - name: Lint with ESLint
        run: |
          cd mobile
          npm run lint -- --max-warnings=0

      - name: Run tests
        run: |
          cd mobile
          npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./mobile/coverage/coverage-final.json
          flags: mobile
          name: mobile-coverage

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: Integration Contract Tests
    runs-on: ubuntu-latest
    
    needs: [backend-tests]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: erp03_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ERP-BACKEND/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run integration contract tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/erp03_integration
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test_secret_key_for_integration
          ENVIRONMENT: testing
        run: |
          cd INTEGRATION
          pytest --asyncio-mode=auto v1/

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit (Python security linter)
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run safety check for Python dependencies
        run: |
          pip install safety
          safety check -r erp-core/requirements.txt || true

      - name: Run npm audit for JavaScript dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

  # ============================================================================
  # Docker Build (Optional - for deployment readiness)
  # ============================================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./erp-core
          file: ./erp-core/Dockerfile
          push: false
          load: true
          tags: erp03-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: erp03-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Quality Gate - All Checks Must Pass
  # ============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, mobile-tests, integration-tests, security-scan]
    
    if: always()

    steps:
      - name: Check if all required jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.mobile-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "Quality gate failed - one or more required checks did not pass"
            exit 1
          fi
          echo "All quality gates passed ✓"
