name: Container

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: backend
            context: ERP-BACKEND
            file: ERP-BACKEND/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.name }}
        run: |
          registry_image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-${COMPONENT}"
          echo "registry_image=${registry_image}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build --file "${{ matrix.file }}" \
            --tag "${{ steps.image.outputs.registry_image }}:${{ github.sha }}" \
            "${{ matrix.context }}"

      - name: Install trivy
        run: |
          TRIVY_VERSION="0.63.0"
          curl -sSLo /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Scan image
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --scanners vuln \
            "${{ steps.image.outputs.registry_image }}:${{ github.sha }}"

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "${{ steps.image.outputs.registry_image }}:${{ github.sha }}"
          docker tag "${{ steps.image.outputs.registry_image }}:${{ github.sha }}" \
            "${{ steps.image.outputs.registry_image }}:main"
          docker push "${{ steps.image.outputs.registry_image }}:main"
          docker inspect --format '{{index .RepoDigests 0}}' \
            "${{ steps.image.outputs.registry_image }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
