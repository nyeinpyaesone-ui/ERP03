name: Container

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build and publish frontend to GHCR and Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: 'v2.2.4'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Hub credentials
        if: env.DOCKERHUB_ENABLED == 'true' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKERHUB_USERNAME must be a valid lowercase Docker Hub namespace"
            exit 1
          }

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract GHCR image metadata
        id: meta-ghcr
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/erp03-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract Docker Hub image metadata
        id: meta-dockerhub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erp03-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish multi-architecture frontend
        id: build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: |
            ${{ steps.meta-ghcr.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true

      - name: Verify GHCR frontend manifest architectures
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/erp03-frontend
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_REF@$DIGEST" |
            jq -e '[.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))] | map(.architecture) | unique | length == 2' >/dev/null
          {
            echo "## Frontend image publication"
            echo
            echo "- Primary image: $IMAGE_REF"
            echo "- Digest: $DIGEST"
            echo "- Verified platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Docker Hub frontend manifest architectures
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          image_ref="docker.io/$DOCKERHUB_USERNAME/erp03-frontend"
          docker buildx imagetools inspect --raw "$image_ref@$DIGEST" |
            jq -e '[.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))] | map(.architecture) | unique | length == 2' >/dev/null

      - name: Sign the published GHCR frontend
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/erp03-frontend
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF@$DIGEST"

      - name: Verify GHCR frontend signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/erp03-frontend
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@${{ github.ref }}
        run: |
          set -Eeuo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF@$DIGEST"

      - name: Sign the Docker Hub frontend mirror
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "docker.io/$DOCKERHUB_USERNAME/erp03-frontend@$DIGEST"

      - name: Verify Docker Hub frontend signature
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@${{ github.ref }}
        run: |
          set -Eeuo pipefail
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "docker.io/$DOCKERHUB_USERNAME/erp03-frontend@$DIGEST"

      - name: Log out from registries
        if: always() && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker logout ghcr.io || true
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            docker logout docker.io || true
          fi
