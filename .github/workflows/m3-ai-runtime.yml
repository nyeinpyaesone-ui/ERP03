name: M3 AI Runtime Qualification

on:
  pull_request:
    paths:
      - 'AI-BACKEND/**'
      - 'INTEGRATION/**'
      - '.github/workflows/m3-ai-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'AI-BACKEND/**'
      - 'INTEGRATION/**'
      - '.github/workflows/m3-ai-runtime.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI-BACKEND
    steps:
      - uses: actions/checkout@34e1148760a9e6e2b7d6a8b9c3b8d2c1a4e5f6a7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r runtime/requirements.txt
      - name: Run M3 runtime tests
        run: python -m pytest runtime/test_runtime.py -q
