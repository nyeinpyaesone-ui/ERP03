name: M3 AI Runtime Qualification

on:
  pull_request:
    paths:
      - 'AI-BACKEND/**'
      - 'INTEGRATION/**'
      - '.github/workflows/m3-ai-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'AI-BACKEND/**'
      - 'INTEGRATION/**'
      - '.github/workflows/m3-ai-runtime.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI-BACKEND
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r runtime/requirements.txt
      - name: Run M3 runtime tests
        run: python -m pytest runtime/test_runtime.py -q
