name: Action Pinning

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify SHA-pinned actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify action references
        shell: bash
        run: |
          set -euo pipefail
          if grep -hRE '^[[:space:]]*uses:[[:space:]]+[^@[:space:]]+@' .github/workflows --include='*.yml' --include='*.yaml' | grep -vE '@[0-9a-fA-F]{40}([[:space:]]|$)'; then
            echo 'Mutable GitHub Action reference detected.'
            exit 1
          fi
          echo 'All GitHub Actions are pinned to immutable commit SHAs.'
