name: Action Pinning

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/pin-github-actions.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/pin-github-actions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Verify GitHub Action pins
        run: python3 scripts/pin-github-actions.py --check
