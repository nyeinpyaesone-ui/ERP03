name: Action Pinning

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify SHA-pinned actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify action references
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r line; do
            if [[ "$line" =~ uses:[[:space:]]+[^@[:space:]]+@([^[:space:]#]+) ]]; then
              ref="${BASH_REMATCH[1]}"
              if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::Mutable action reference: $line"
                violations=1
              fi
            fi
          done < <(grep -hRE '^[[:space:]]*uses:' .github/workflows --include='*.yml' --include='*.yaml' || true)

          if [[ "$violations" -ne 0 ]]; then
            exit 1
          fi
          echo "All GitHub Actions are pinned to immutable 40-character commit SHAs."
