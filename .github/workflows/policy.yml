name: Policy Enforcement

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  opa-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin
      - name: Fetch OPA policies
        run: |
          git clone https://github.com/erp03/policies.git /tmp/policies 2>/dev/null || echo "WARNING: External policies repo unavailable, skipping policy scans"
        continue-on-error: true
      - name: Scan Dockerfiles
        run: |
          if [ -d /tmp/policies ]; then
            conftest test --policy /tmp/policies Dockerfile ERP-BACKEND/Dockerfile frontend/Dockerfile || true
          else
            echo "Skipping Dockerfile scan: policies repo not available"
          fi
        continue-on-error: true
      - name: Scan Kubernetes manifests
        run: |
          if [ -d /tmp/policies ]; then
            conftest test --policy /tmp/policies infra/kubernetes/ || true
          else
            echo "Skipping Kubernetes scan: policies repo not available"
          fi
        continue-on-error: true
