[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: end-to-end slices that require a migrated PostgreSQL database (DATABASE_URL)
    requires_database: tests that need a reachable PostgreSQL database
# T-1: Track deprecation warnings — do not suppress; fail on new warnings
addopts = -ra -W default::DeprecationWarning -W default::PendingDeprecationWarning --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50
filterwarnings =
    # Track these known deprecations (don't fail yet)
    default::DeprecationWarning
    default::PendingDeprecationWarning
