worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; multi_accept on; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;
  keepalive_requests 1000;
  client_max_body_size 50m;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

  upstream erpnext_web { server erpnext:8000; keepalive 32; }
  upstream erpnext_socketio { server erpnext:9000; keepalive 16; }

  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
  }

  server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /home/frappe/frappe-bench/sites;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location /assets/ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location /socket.io/ {
      proxy_pass http://erpnext_socketio;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Frappe-Site-Name $host;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location / {
      try_files /$host/public/$uri @webserver;
    }

    location @webserver {
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Frappe-Site-Name $host;
      proxy_set_header Host $host;
      proxy_set_header X-Use-X-Accel-Redirect True;
      proxy_read_timeout 120s;
      proxy_redirect off;
      proxy_pass http://erpnext_web;
    }
  }
}
