appId: com.ai.erp
---
# Critical UI flow. Use only with a dedicated test environment/account.
- launchApp
- tapOn: "Email"
- inputText: "test@example.invalid"
- tapOn: "Password"
- inputText: "TEST_ONLY_PASSWORD"
- tapOn: "Sign In"
- assertVisible: "Dashboard"
- tapOn: "Invoices"
- assertVisible: "All Invoices"
- tapOn: "Add Invoice"
- tapOn: "Customer"
- inputText: "Myanmar Trading Co."
- tapOn: "Amount"
- inputText: "500000"
- tapOn: "Create Invoice"
- assertVisible: "Invoice created successfully"
- tapOn: "Back"
- assertVisible: "All Invoices"
