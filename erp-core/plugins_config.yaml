# ERP-Core Plugin Configuration

# Enable plugins by adding them to this list
enabled:
  - ecommerce
  - pos

# Disabled plugins (available but not loaded)
disabled:
  - mrp
  - bi
  - supply_chain
  - manufacturing
  - quality
  - assets

# Plugin-specific configurations
config:
  ecommerce:
    # E-commerce settings
    tax_provider: stripe
    shipping_providers:
      - fedex
      - ups
      - dhl
    currency: USD
    inventory_sync: true
    
  pos:
    # Point of Sale settings
    hardware_integration: true
    receipt_printer: enabled
    cash_drawer: enabled
    barcode_scanner: enabled
    offline_mode: true
    
  mrp:
    # Material Requirements Planning
    planning_horizon_days: 90
    safety_stock_percentage: 10
    lead_time_buffer_days: 5
    
  bi:
    # Business Intelligence
    refresh_interval_hours: 24
    cache_enabled: true
    dashboard_widgets:
      - revenue_chart
      - sales_funnel
      - inventory_turnover
      
  supply_chain:
    # Supply Chain Management
    auto_reorder_point: true
    supplier_rating_enabled: true
    
  manufacturing:
    # Manufacturing Execution
    work_center_capacity_planning: true
    quality_checkpoints: true
    
  quality:
    # Quality Management
    iso_compliance: true
    corrective_action_workflow: true
    
  assets:
    # Asset Management
    depreciation_method: straight_line
    maintenance_scheduling: true
