apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erpnext-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: erpnext-secrets
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: secret/erpnext
        property: db-host
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/erpnext
        property: db-password
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/erpnext
        property: redis-url
