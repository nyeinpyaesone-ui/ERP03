[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ERP-BACKEND/app", "ERP-BACKEND/tests"]
exclude = ["ERP-BACKEND/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["ERP-BACKEND/tests"]
asyncio_mode = "auto"
