[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ERP-BACKEND/app", "ERP-BACKEND/tests"]
exclude = ["ERP-BACKEND/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.coverage.run]
source = ["ERP-BACKEND/app"]
omit = ["*/tests/*", "*/alembic/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
