version: '3.8'
services:
  backend:
    build:
      context: ./ERP-BACKEND
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://erp03:erp03@postgres:5432/erp03
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./ERP-BACKEND:/app
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: erp03
      POSTGRES_PASSWORD: erp03
      POSTGRES_DB: erp03
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
