# Base docker-compose configuration (shared settings)
services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-erp_solution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-erp} -d $${DB_NAME:-erp_solution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp-network]

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "$${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp-network]

  erp-backend:
    build:
      context: ./ERP-BACKEND
      dockerfile: Dockerfile
    container_name: erp-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-erp}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-erp_solution}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [erp-network]

  frontend:
    build:
      context: ./ERP-BACKEND/frontend-react
      dockerfile: Dockerfile
    container_name: erp-frontend
    depends_on:
      - erp-backend
    networks: [erp-network]

  ollama:
    image: ollama/ollama:latest
    container_name: erp-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks: [erp-network]

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  erp-network:
    driver: bridge
