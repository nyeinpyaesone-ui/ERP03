services:
  backend:
    build: ./ERP-BACKEND
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: production
      OLLAMA_BASE_URL: http://ollama:11434
  frontend:
    build: ./frontend
    ports: ["3000:80"]
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
volumes:
  ollama:
