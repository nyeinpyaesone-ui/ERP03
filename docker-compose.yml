services:
  postgres:
    image: postgres:15.14
    profiles: ["full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp03}
      POSTGRES_USER: ${POSTGRES_USER:-erp03}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  migrate:
    build: ./ERP-BACKEND
    profiles: ["full"]
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erp03}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp03}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    image: ${GHCR_IMAGE_BACKEND:-ghcr.io/nyeinpyaesone-ui/erp03-backend}:${IMAGE_TAG:-latest}
    build: ./ERP-BACKEND
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a postgresql+asyncpg:// URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      DATABASE_PATH: /app/.local/erp03.sqlite3
    volumes:
      - erp_data:/app/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    image: ${GHCR_IMAGE_FRONTEND:-ghcr.io/nyeinpyaesone-ui/erp03-frontend}:${IMAGE_TAG:-latest}
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  erp_data:
