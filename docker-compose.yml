services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-erp03_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp03_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_user
      - db_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - erp03_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./ERP-BACKEND
      dockerfile: Dockerfile
      target: production
    restart: "no"
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-erp03_prod}
      SECRET_KEY_FILE: /run/secrets/jwt_secret
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    secrets:
      - db_user
      - db_password
      - jwt_secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp03_internal
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./ERP-BACKEND
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-erp03_prod}
      SECRET_KEY_FILE: /run/secrets/jwt_secret
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    secrets:
      - db_user
      - db_password
      - jwt_secret
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - erp03_internal
      - erp03_public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./ERP-BACKEND
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-erp03_prod}
      SECRET_KEY_FILE: /run/secrets/jwt_secret
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    secrets:
      - db_user
      - db_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - erp03_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--prefetch-multiplier=1", "--max-tasks-per-child=100"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - erp03_public
      - erp03_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  flower:
    profiles: ["ops"]
    build:
      context: ./ERP-BACKEND
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp03_internal
    command: ["celery", "-A", "app.workers.celery_app", "flower", "--port=5555"]

networks:
  erp03_internal:
    driver: bridge
    internal: true
  erp03_public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
