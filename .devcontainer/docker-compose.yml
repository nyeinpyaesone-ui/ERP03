services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      AGENT_ENV: codespace
      VENV_DIR: /opt/erp03-venv
      DATABASE_URL: postgresql+asyncpg://erp03:${POSTGRES_PASSWORD:-erp03-local-only}@postgres:5432/erp03
      REDIS_URL: redis://:${REDIS_PASSWORD:-erp03-local-only}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-erp03-local-only}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: erp03
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp03-local-only}
      POSTGRES_DB: erp03
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp03 -d erp03"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-erp03-local-only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-erp03-local-only}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-erp03-local-only}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  pgdata:
  redis_data:
