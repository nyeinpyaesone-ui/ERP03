version: "1.0.0"
# Production compose file — hardened per docs/IMPLEMENTATION_STATUS.md# finding #3 ("Production Compose contains unsafe defaults").
## Requires a .env.production file (not committed) defining, with NO fallback
# defaults, at minimum:
#   DB_USER, DB_PASSWORD, DB_NAME
#   REDIS_PASSWORD
#   SECRET_KEY
#   CORS_ORIGINS, API_URL, WS_URL
#   BACKEND_IMAGE_TAG, FRONTEND_IMAGE_TAG, OLLAMA_IMAGE_TAG
## Compose fails to start if a required variable is unset (the ${VAR:?err}
# syntax below), instead of silently falling back to "changeme".
services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # No host port mapping: only reachable from other containers on
    # erp-network. Use `docker compose exec postgres psql ...` for access,
    # or a bastion/SSH tunnel if external access is genuinely required.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    # No host port mapping — internal network only.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network
  backend:
    image: powerrangeranikg/erp03-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG must be set, e.g. v1.0.0 or a digest}
    container_name: erp03-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: production
      OLLAMA_URL: http://ollama:11434
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - erp-network
  frontend:
    image: powerrangeranikg/erp03-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG must be set, e.g. v1.0.0 or a digest}
    container_name: erp03-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${API_URL:?API_URL must be set}
      REACT_APP_WS_URL: ${WS_URL:?WS_URL must be set}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - erp-network
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:?OLLAMA_IMAGE_TAG must be set, e.g. 0.32.5}
    container_name: erp03-ollama
    restart: unless-stopped
    # No host port mapping — only the backend needs to reach Ollama, over
    # erp-network at http://ollama:11434.
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - erp03-network
  nginx:
    image: nginx:alpine
    container_name: erp03-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - erp03-network
volumes:
  postgres_data:
  redis_data:
  ollama_data:
  backend_logs:
networks:
  erp-network:
    driver: bridge
  erp03-network:
    driver: bridge
